name: build-compilationdb
description: >-
  Emit build/OpenShock-Core-V2/compile_commands.json with native ESP-IDF for the
  canonical OpenShock-Core-V2 config.
inputs:
  version:
    required: true
    description: 'Current firmware version'
  target:
    required: false
    default: reconfigure
    description: >-
      The idf.py target: reconfigure runs CMake only, which writes compile_commands.json;
      app also compiles, for tools that trace the compiler (CodeQL).

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-esp-idf

    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version-file: .python-version
        cache: 'pip'

    # scripts/build.py and the scripts CMake runs need requirements.txt; see docs/DEVELOPING.md.
    - name: Install Python dependencies
      shell: bash
      run: pip install --require-hashes -r requirements.txt

    # ccache stays off: it would hide compiler invocations from CodeQL's tracer.
    - name: Generate compilation database (OpenShock-Core-V2)
      shell: bash
      run: |
        set -euo pipefail
        python scripts/build.py OpenShock-Core-V2 "$TARGET"
        test -f build/OpenShock-Core-V2/compile_commands.json \
          || { echo "::error::compile_commands.json was not generated"; exit 1; }
      env:
        TARGET: ${{ inputs.target }}
        OPENSHOCK_FW_VERSION: ${{ inputs.version }}
        OPENSHOCK_FW_GIT_COMMIT: ${{ github.sha }}
