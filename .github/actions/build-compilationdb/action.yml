name: build-compilationdb
description: Generate compile_commands.json for the OpenShock-Core-V2
inputs:
  version:
    required: true
    description: 'Current firmware version'
  target:
    required: false
    default: reconfigure
    description: 'The idf.py target, reconfigure writes compile_commands.json, app also compiles for tools that trace the compiler (CodeQL)'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-esp-idf

    # scripts/build.py and the scripts CMake runs need requirements.txt
    - uses: ./.github/actions/install-python-deps

    # ccache stays off, it would hide compiler invocations from CodeQL's tracer.
    - name: Generate compilation database (OpenShock-Core-V2)
      shell: bash
      run: |
        set -euo pipefail
        python scripts/build.py OpenShock-Core-V2 "$TARGET"
        test -f build/OpenShock-Core-V2/compile_commands.json \
          || { echo "::error::compile_commands.json was not generated"; exit 1; }
      env:
        TARGET: ${{ inputs.target }}
        OPENSHOCK_FW_VERSION: ${{ inputs.version }}
        OPENSHOCK_FW_GIT_COMMIT: ${{ github.sha }}
