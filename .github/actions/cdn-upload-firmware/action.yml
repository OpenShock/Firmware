name: cdn-upload-firmware
description: Uploads firmware partitions and merged binaries for every board to CDN along with SHA256 checksums
inputs:
  bunny-stor-hostname:
    description: Bunny SFTP Hostname
    required: true
  bunny-stor-username:
    description: Bunny SFTP Username
    required: true
  bunny-stor-password:
    description: Bunny SFTP Password
    required: true
  fw-version:
    description: Firmware version
    required: true
  boards:
    description: 'Newline-separated list of boards to upload'
    required: true

runs:
  using: composite
  steps:
    # Grab every firmware artifact in one shot: the shared static filesystem
    # partition plus each board's build partitions and merged binary. They land
    # under artifacts/<artifact-name>/ so the loop below can pick them per board.
    - name: Download firmware artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
      with:
        path: artifacts
        pattern: firmware_*

    # Assemble the full /<version>/ tree locally, one directory per board, so it
    # can be pushed in a single mirror. Each board directory keeps the previous
    # per-board layout: static + build partitions, the merged firmware.bin, and
    # md5/sha256 checksums over every .bin.
    - name: Assemble upload tree
      shell: bash
      env:
        BOARDS: ${{ inputs.boards }}
      run: |
        set -euo pipefail
        rm -rf upload
        while IFS= read -r board; do
          [ -z "$board" ] && continue
          dest="upload/$board"
          mkdir -p "$dest"
          cp artifacts/firmware_staticfs/*.bin "$dest"/
          cp "artifacts/firmware_build_$board"/*.bin "$dest"/
          cp "artifacts/firmware_merged_$board"/OpenShock_*.bin "$dest"/firmware.bin
          (
            cd "$dest"
            find . -type f -name '*.bin' -exec md5sum {} \; > hashes.md5.txt
            find . -type f -name '*.bin' -exec sha256sum {} \; > hashes.sha256.txt
          )
        done <<< "$BOARDS"

    # A single lftp mirror pushes the whole tree (every board directory) in one
    # command/connection, replacing the old one-upload-per-board matrix.
    - name: Upload artifacts to CDN
      uses: ./.github/actions/sftp-mirror
      with:
        host: ${{ inputs.bunny-stor-hostname }}
        username: ${{ inputs.bunny-stor-username }}
        password: ${{ inputs.bunny-stor-password }}
        local-path: upload
        remote-path: /${{ inputs.fw-version }}/
