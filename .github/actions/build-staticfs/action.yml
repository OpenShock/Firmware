name: build-staticfs
description: Pack the frontend build into the board-independent www asset image (and, for a 1.x release, the littlefs staticfs image)

inputs:
  version:
    description: 'Firmware version the images are for; a 1.x version also gets the littlefs staticfs.bin'
    required: true

runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-python-deps

    # One flat image serves every board. A 1.x hub's OTA only accepts a littlefs image it can mount, so the 1.x
    # bridge release (the 1.9.x pivot) also ships the assets as littlefs staticfs.bin; no other release does.
    - name: Build asset images
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        legacy=()
        if [[ "$VERSION" == 1.* ]]; then
          legacy=(--legacy-output staticfs.bin)
        fi
        python scripts/gen_staticfs.py \
          --frontend-dir frontend \
          --output www.bin \
          "${legacy[@]}" \
          --partition-csv partitions/ota_4mb.csv \
          --skip-frontend-build

    - name: Upload asset image artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: firmware_staticfs
        path: |
          www.bin
          staticfs.bin
        retention-days: 7
        if-no-files-found: error
