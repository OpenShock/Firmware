name: build-staticfs
description: Pack the frontend build into the board-independent static0 littlefs image

runs:
  using: composite
  steps:
    - uses: ./.github/actions/install-python-deps

    # Sized from partitions/ota_4mb.csv, the table every board uses
    - name: Build static filesystem image
      shell: bash
      run: |
        python scripts/gen_staticfs.py \
          --frontend-dir frontend \
          --staging-dir staticfs \
          --output staticfs.bin \
          --partition-csv partitions/ota_4mb.csv \
          --skip-frontend-build

    - name: Upload static filesystem artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: firmware_staticfs
        path: staticfs.bin
        retention-days: 7
        if-no-files-found: error
