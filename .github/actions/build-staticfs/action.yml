name: build-staticfs
description: >-
  Pack the frontend build (from build-frontend, same job) into the board-independent
  static0 littlefs image with scripts/gen_staticfs.py.

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version-file: .github/scripts/.python-version
        cache: 'pip'

    # gen_staticfs.py needs only littlefs-python; the rest of requirements.txt is for the merge.
    - name: Install Python dependencies
      shell: bash
      run: pip install "$(grep -E '^littlefs-python==' requirements.txt)"

    # Sized from partitions/ota_4mb.csv, the table every board uses.
    - name: Build static filesystem image
      shell: bash
      run: |
        python scripts/gen_staticfs.py \
          --frontend-dir frontend \
          --staging-dir staticfs \
          --output staticfs.bin \
          --partition-csv partitions/ota_4mb.csv \
          --skip-frontend-build

    - name: Upload static filesystem artifact
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: firmware_staticfs
        path: staticfs.bin
        retention-days: 7
        if-no-files-found: error
