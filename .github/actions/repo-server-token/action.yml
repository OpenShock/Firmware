name: repo-server-token
description: >-
  Mints a GitHub Actions OIDC token for the repository server, so the audience has one definition.

inputs:
  audience:
    description: 'OIDC audience, must match OPENSHOCK__CICD__AUDIENCE on the server'
    required: false
    default: 'openshock-repository-server'

outputs:
  token:
    description: 'The OIDC bearer token. Masked in logs, but still a credential.'
    value: ${{ steps.mint.outputs.token }}

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-ci-scripts

    - id: mint
      shell: bash
      env:
        AUDIENCE: ${{ inputs.audience }}
      run: python .github/scripts/repo_server_token.py
