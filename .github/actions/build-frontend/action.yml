name: build-frontend
description: >-
  Build the captive-portal frontend into frontend/build, optionally running its type
  check and unit tests first.
inputs:
  checks:
    description: 'Run svelte-check and the unit tests before building.'
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
      with:
        node-version-file: ./frontend/package.json

    - name: Install pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0
      with:
        cache: true
        cache_dependency_path: ./frontend/pnpm-lock.yaml
        package_json_file: ./frontend/package.json
        run_install: |
          - recursive: true
            cwd: ./frontend
            args: [--frozen-lockfile, --strict-peer-dependencies]

    - name: Check
      if: ${{ inputs.checks == 'true' }}
      working-directory: ./frontend
      shell: bash
      run: pnpm run check

    # TODO: run e2e tests once playwright installs on the runner
    - name: Test
      if: ${{ inputs.checks == 'true' }}
      working-directory: ./frontend
      shell: bash
      run: pnpm test:unit

    - name: Build
      working-directory: ./frontend
      shell: bash
      run: pnpm run build
