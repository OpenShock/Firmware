name: build-frontend
description: Build the captive-portal frontend into frontend/build, optionally running its checks first
inputs:
  checks:
    required: false
    default: 'true'
    description: 'Run svelte-check and the unit tests before building'

runs:
  using: composite
  steps:
    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
      with:
        node-version-file: ./frontend/package.json

    - name: Install pnpm
      uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115  # v6.1.1
      with:
        cache: true
        cache_dependency_path: ./frontend/pnpm-lock.yaml
        package_json_file: ./frontend/package.json
        run_install: |
          - recursive: true
            cwd: ./frontend
            args: [--frozen-lockfile, --strict-peer-dependencies]

    - name: Check
      if: ${{ inputs.checks == 'true' }}
      working-directory: ./frontend
      shell: bash
      run: pnpm run check

    # TODO: run e2e tests once playwright installs on the runner
    - name: Test
      if: ${{ inputs.checks == 'true' }}
      working-directory: ./frontend
      shell: bash
      run: pnpm test:unit

    - name: Build
      working-directory: ./frontend
      shell: bash
      run: pnpm run build
