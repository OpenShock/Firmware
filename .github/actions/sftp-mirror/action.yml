name: sftp-mirror
description: Mirror a local directory to an SFTP server using lftp. Replaces milanmk/actions-file-deployer.
inputs:
  host:
    description: SFTP hostname
    required: true
  username:
    description: SFTP username
    required: true
  password:
    description: SFTP password. Must not contain a comma (lftp -u splits on comma).
    required: true
  local-path:
    description: Local source directory
    required: true
  remote-path:
    description: Target remote path
    required: true
  delete-extra:
    description: If 'true', remove remote files that are not present locally.
    required: false
    default: 'false'
  parallel:
    description: >
      Number of files to transfer concurrently (lftp mirror --parallel). Each
      transfer opens one SFTP connection; Bunny allows ~100 concurrent per zone
      and 100-200 per IP. 'auto' uses min(nproc, 25).
    required: false
    default: 'auto'

runs:
  using: composite
  steps:
    - name: Install lftp
      shell: bash
      run: |
        if ! command -v lftp >/dev/null 2>&1; then
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
        fi

    - name: Mirror to SFTP
      shell: bash
      env:
        SFTP_HOST: ${{ inputs.host }}
        SFTP_USER: ${{ inputs.username }}
        SFTP_PASS: ${{ inputs.password }}
        LOCAL_PATH: ${{ inputs.local-path }}
        REMOTE_PATH: ${{ inputs.remote-path }}
        DELETE_EXTRA: ${{ inputs.delete-extra }}
        PARALLEL: ${{ inputs.parallel }}
      run: |
        set -euo pipefail
        # 'auto' -> min(nproc, 25): scale with the runner, capped at Bunny's
        # per-IP connection limit.
        if [ "$PARALLEL" = "auto" ]; then
          cores=$(nproc)
          PARALLEL=$(( cores < 25 ? cores : 25 ))
        fi
        # --parallel transfers N files at once; lftp mirror is serial otherwise.
        mirror_flags="-R --verbose --parallel=$PARALLEL"
        if [ "$DELETE_EXTRA" = "true" ]; then
          mirror_flags="$mirror_flags --delete"
        fi
        lftp -u "$SFTP_USER,$SFTP_PASS" "sftp://$SFTP_HOST" -e "set sftp:auto-confirm yes; mirror $mirror_flags $LOCAL_PATH $REMOTE_PATH; bye"
