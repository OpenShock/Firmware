name: build-firmware
description: Builds the firmware partitions and uploads them as an artifact
inputs:
  board:
    required: true
    description: 'Board name to build'
  version:
    required: true
    description: 'Current firmware version'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/pio-cache
      with:
        env: ${{ inputs.board }}

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        cache: 'pip'

    - name: Install python dependencies
      shell: bash
      run: pip install -r requirements.txt

    - name: Build firmware
      working-directory: .
      shell: bash
      # head_commit.timestamp only exists on push events, so derive the build
      # date from the checked-out commit (falling back to now) - otherwise
      # schedule/dispatch builds bake in an empty date.
      run: |
        export OPENSHOCK_FW_BUILD_DATE="$(git show -s --format=%cI HEAD 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
        # The ESP-IDF bootloader link (bootloader.elf) intermittently races its
        # own linker-script generation and fails with "cannot open linker script
        # file bootloader.ld" - a different board set fails on each run while
        # siblings with identical flags succeed. Once an attempt has run, the
        # script is on disk, so an incremental retry re-links only the bootloader
        # and succeeds. Retry a couple of times before giving up for real.
        for attempt in 1 2 3; do
          if pio run -e ${{ inputs.board }}; then
            exit 0
          fi
          echo "::warning::pio run attempt ${attempt} failed for ${{ inputs.board }} (likely the intermittent bootloader.ld link race); retrying"
        done
        echo "::error::pio run failed for ${{ inputs.board }} after 3 attempts"
        exit 1
      env:
        OPENSHOCK_FW_VERSION: ${{ inputs.version }}
        OPENSHOCK_FW_GIT_REF: ${{ github.ref }}
        OPENSHOCK_FW_GIT_COMMIT: ${{ github.sha }}

    - name: Upload build artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
      with:
        name: firmware_build_${{ inputs.board }}
        path: .pio/build/${{ inputs.board }}/*.bin
        retention-days: 1
        if-no-files-found: error
