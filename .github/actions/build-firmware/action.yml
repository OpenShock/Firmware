name: build-firmware
description: Compile app, bootloader, and parition-table images without board stamps and upload it to build artifacts.
inputs:
  variant:
    required: true
    description: 'Build variant id, as get_vars.py emits it (e.g. esp32s3-6832dbd5)'
  version:
    required: true
    description: 'Current firmware version'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-esp-idf
      id: idf

    # scripts/build.py and the scripts CMake runs need requirements.txt
    - uses: ./.github/actions/install-python-deps

    # Entries are immutable, so the key ends in the run and restore-keys picks the newest store
    - name: Restore ccache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-v2-${{ runner.os }}-${{ steps.idf.outputs.version }}-${{ inputs.variant }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: ccache-v2-${{ runner.os }}-${{ steps.idf.outputs.version }}-${{ inputs.variant }}-

    - name: Build firmware
      shell: bash
      run: |
        set -euo pipefail
        export IDF_CCACHE_ENABLE=1
        ccache --zero-stats >/dev/null 2>&1 || true
        python scripts/build.py --variant "$VARIANT" app bootloader partition-table
      env:
        VARIANT: ${{ inputs.variant }}
        OPENSHOCK_FW_VERSION: ${{ inputs.version }}
        OPENSHOCK_BUILD_DIR: build/firmware
        OPENSHOCK_FW_GIT_COMMIT: ${{ github.sha }}
        CCACHE_COMPILERCHECK: content
        CCACHE_MAXSIZE: 500M # Could be lower maybe

    # Log caching statistics to actions run summary
    - name: ccache statistics
      id: ccache-stats
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
      run: |
        ccache --show-stats --verbose || ccache -s
        {
          echo "### ccache ($VARIANT)"
          echo '```'
          ccache --show-stats || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"
        misses=$(ccache --print-stats 2>/dev/null | awk -F'\t' '$1 == "cache_miss" { print $2 }')
        echo "misses=${misses:-unknown}" >> "$GITHUB_OUTPUT"

    - name: Save ccache
      if: ${{ steps.ccache-stats.outputs.misses != '0' && !github.event.pull_request.head.repo.fork }} # Probably dont wanna save cache from external prs
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ccache-v2-${{ runner.os }}-${{ steps.idf.outputs.version }}-${{ inputs.variant }}-${{ github.run_id }}-${{ github.run_attempt }}

    # Copy built images out for artifact upload
    - name: Stage partition images
      shell: bash
      env:
        BUILD_DIR: build/firmware
        OUT_DIR: dist/${{ inputs.variant }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT_DIR"
        cp "$BUILD_DIR/firmware.bin"                        "$OUT_DIR/app.bin"
        cp "$BUILD_DIR/bootloader/bootloader.bin"           "$OUT_DIR/bootloader.bin"
        cp "$BUILD_DIR/partition_table/partition-table.bin" "$OUT_DIR/partition-table.bin"

    - name: Upload partition images
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: variant_${{ inputs.variant }}
        path: dist
        retention-days: 1
        if-no-files-found: error
