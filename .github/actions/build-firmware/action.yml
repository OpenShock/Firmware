name: build-firmware
description: >-
  Compile one build variant (scripts/utils/boards.py) with native ESP-IDF and upload its
  unstamped app, bootloader and partition-table images for the package job to stamp.
inputs:
  variant:
    required: true
    description: 'Build variant id, as get_vars.py emits it (e.g. esp32s3-6832dbd5)'
  version:
    required: true
    description: 'Current firmware version'

runs:
  using: composite
  steps:
    - uses: ./.github/actions/setup-esp-idf
      id: idf

    # One store per variant and IDF version. Entries are immutable, so the key ends in the run and
    # restore-keys picks the newest store; only develop saves, so every other ref restores develop's.
    - name: Compute ccache key
      id: ccache-key
      shell: bash
      env:
        IDF_VERSION: ${{ steps.idf.outputs.version }}
        VARIANT: ${{ inputs.variant }}
      run: echo "key=ccache-v2-$RUNNER_OS-$IDF_VERSION-$VARIANT-" >> "$GITHUB_OUTPUT"

    - name: Restore ccache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ${{ steps.ccache-key.outputs.key }}${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          ${{ steps.ccache-key.outputs.key }}

    # Code targets only: the static0 image is the staticfs job's.
    - name: Build firmware
      shell: bash
      run: |
        set -euo pipefail
        export IDF_CCACHE_ENABLE=1
        ccache --zero-stats >/dev/null 2>&1 || true
        python scripts/build.py --variant "$VARIANT" app bootloader partition-table
      env:
        VARIANT: ${{ inputs.variant }}
        OPENSHOCK_FW_VERSION: ${{ inputs.version }}
        # Fixed: the build directory is on every compile command line, so it is part of each ccache hash.
        OPENSHOCK_BUILD_DIR: build/firmware
        OPENSHOCK_FW_GIT_COMMIT: ${{ github.sha }}
        # content, not mtime: the restored toolchain has fresh timestamps every run.
        CCACHE_COMPILERCHECK: content
        # Generous for one sdkconfig's objects; it only stops a store growing without bound.
        CCACHE_MAXSIZE: 500M

    # A near-zero hit rate on an unchanged tree means something per-commit is being force-included.
    - name: ccache statistics
      shell: bash
      env:
        VARIANT: ${{ inputs.variant }}
      run: |
        ccache --show-stats --verbose || ccache -s
        {
          echo "### ccache ($VARIANT)"
          echo '```'
          ccache --show-stats || true
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    # develop only: another ref's entry is restorable by that ref alone and would only spend the 10 GB.
    - name: Save ccache
      if: ${{ github.ref == 'refs/heads/develop' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: ~/.cache/ccache
        key: ${{ steps.ccache-key.outputs.key }}${{ github.run_id }}-${{ github.run_attempt }}

    # dist/<variant>/ so the package job can merge every variant into one tree; app.bin is the OTA name.
    - name: Stage partition images
      shell: bash
      env:
        BUILD_DIR: build/firmware
        OUT_DIR: dist/${{ inputs.variant }}
      run: |
        set -euo pipefail
        mkdir -p "$OUT_DIR"
        cp "$BUILD_DIR/firmware.bin"                        "$OUT_DIR/app.bin"
        cp "$BUILD_DIR/bootloader/bootloader.bin"           "$OUT_DIR/bootloader.bin"
        cp "$BUILD_DIR/partition_table/partition-table.bin" "$OUT_DIR/partition-table.bin"

    # variant_*, not firmware_*: repo-server-publish downloads firmware_* and must not get unstamped images.
    - name: Upload partition images
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: variant_${{ inputs.variant }}
        path: dist
        retention-days: 1
        if-no-files-found: error
