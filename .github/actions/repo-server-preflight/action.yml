name: repo-server-preflight
description: >-
  Checks the three things a firmware publish depends on and cannot recover from
  mid-flight: the server answers, this repository is authorised to publish, and every
  board being published is in the server's catalog. Reads only - nothing here writes.

inputs:
  server-url:
    description: 'Base URL of the repository server'
    required: true
  token:
    description: 'OIDC token from the repo-server-token action'
    required: true
  boards:
    description: >-
      Newline-separated boards to check against the catalog. Empty checks
      authorisation only, which is what a bare connectivity check wants.
    required: false
    default: ''

runs:
  using: composite
  steps:

    # Separates "the server is down" from "the token was refused". Without it, a failure
    # below is ambiguous: an unreachable host and a rejected token look the same.
    - name: Server is reachable
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
      run: |
        set -euo pipefail
        code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 "$SERVER_URL/2/firmware/manifest")
        echo "GET /2/firmware/manifest -> $code"
        if [ "$code" != "200" ]; then
          echo "::error::Server is not serving the public manifest (HTTP $code)."
          exit 1
        fi

    # Aborting a release id that does not exist is the cheapest authenticated call there
    # is: the lookup misses, so nothing is ever marked aborted or removed from storage.
    # Reaching that miss means signature, issuer, audience, registration and the
    # publish_firmware scope were all accepted, which is the whole question.
    - name: Repository is authorised to publish firmware
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
        TOKEN: ${{ inputs.token }}
      run: |
        set -euo pipefail
        release_id=$(cat /proc/sys/kernel/random/uuid)
        code=$(curl -sS -o /tmp/preflight-auth.json -w '%{http_code}' --max-time 20 -X DELETE \
          "$SERVER_URL/2/firmware/releases/$release_id" \
          -H "Authorization: Bearer $TOKEN")
        echo "DELETE /2/firmware/releases/$release_id -> $code"
        cat /tmp/preflight-auth.json 2>/dev/null || true
        echo

        # 401 covers two causes and the server will not say which, deliberately: an
        # unregistered repository is refused with the same response as a bad token, so an
        # outsider cannot probe the allowlist. Both are named here for the operator.
        case "$code" in
          404) echo "Authorised: registered, publish_firmware granted." ;;
          401) echo "::error::Token rejected. Either ${GITHUB_REPOSITORY} is not registered at /admin/repositories, or the audience does not match OPENSHOCK__CICD__AUDIENCE."; exit 1 ;;
          403) echo "::error::Authenticated, but publish_firmware is not granted to ${GITHUB_REPOSITORY}."; exit 1 ;;
          000) echo "::error::No response (timeout or TLS failure)."; exit 1 ;;
          *)   echo "::error::Unexpected HTTP $code from the authorisation probe."; exit 1 ;;
        esac

    # The catalog is seeded by hand and release init rejects a board it does not know. Left
    # unchecked, a missing board fails a publish halfway through - after other boards have
    # already been staged - rather than before it starts.
    - name: Boards are in the server catalog
      if: ${{ inputs.boards != '' }}
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
        BOARDS: ${{ inputs.boards }}
      run: |
        set -euo pipefail
        curl -sSf --max-time 20 "$SERVER_URL/2/firmware/boards" -o /tmp/boards.json
        jq -r '.[] | (.name // .Name)' /tmp/boards.json | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/known.txt
        echo "$BOARDS" | sed '/^[[:space:]]*$/d' | tr '[:upper:]' '[:lower:]' | sort -u > /tmp/wanted.txt

        echo "publishing: $(wc -l < /tmp/wanted.txt), known to server: $(wc -l < /tmp/known.txt)"
        missing=$(comm -23 /tmp/wanted.txt /tmp/known.txt)
        if [ -n "$missing" ]; then
          echo "::error::Not in the server catalog, add them at /admin/firmware/boards:"
          echo "$missing" | sed 's/^/  /'
          exit 1
        fi
        echo "Every board being published is registered."
