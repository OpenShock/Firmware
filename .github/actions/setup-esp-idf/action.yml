name: setup-esp-idf
description: >-
  Install a pinned native ESP-IDF toolchain and put its `idf.py` wrapper on PATH.
  scripts/build.py invokes that wrapper, which activates the tool + venv
  environment itself. Shared by every job that runs idf.py.
inputs:
  idf-version:
    description: 'ESP-IDF version to install (EIM version tag).'
    required: false
    default: 'v6.0.2'
  lookup-only:
    description: >-
      Probe mode. The restore only checks whether the cache entry exists instead of
      downloading it, so a job that just wants to guarantee the cache is populated costs
      seconds when it already is. On a miss the install, prune and save run as normal.
      Nothing is activated in this mode, so the caller cannot build afterwards.
    required: false
    default: 'false'
  save-cache:
    description: >-
      Whether this job may write the ESP-IDF cache. The install is identical for every
      board, so when the key changes all 13 matrix jobs would otherwise tar and upload
      ~3.5 GB simultaneously; one wins the reservation and the rest waste ~20 s each and
      log "Cache save failed". ci-build nominates a single writer instead.
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    # Cache the whole ESP-IDF install so a warm run skips the multi-minute IDF source
    # clone + submodule fetch + toolchain download. On Linux this action installs the
    # source (and its submodules) under /tmp/esp/idf and the tools / Python venv under
    # /tmp/esp (older layouts used /opt/esp or ~/.espressif, so cache all three - missing
    # paths are skipped). Keyed by version; bump the trailing number to invalidate.
    #
    # Split into restore + save so the prune below lands between them, and the cache
    # stores the trimmed install rather than the full one.
    - name: Restore ESP-IDF install
      id: idf-cache
      uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: |
          /tmp/esp
          /opt/esp
          ~/.espressif
        # The one definition of this key; the warm-esp-idf job reaches it through
        # lookup-only rather than repeating it. Bump the trailing number to invalidate.
        key: esp-idf-${{ runner.os }}-${{ inputs.idf-version }}-5
        restore-keys: |
          esp-idf-${{ runner.os }}-${{ inputs.idf-version }}-
        lookup-only: ${{ inputs.lookup-only }}

    # Only on a cache miss. The action re-runs `apt-get install` (git, cmake,
    # ninja-build, ccache, ...) and re-prepares the IDF clone on every invocation, even
    # when the restored tree is already complete. Measured with 13 matrix jobs running at
    # once, that took 867 s in a job whose actual firmware build took 128 s - about 700 s
    # of it apt fetching cmake at roughly 35 KB/s while every other job did the same. The
    # cached tree is self-contained, so a warm run activates it directly below instead.
    #
    # v1 is a moving branch (no release tags), pinned by SHA.
    - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae  # v1
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      with:
        version: ${{ inputs.idf-version }}

    # The warm path. EIM writes an activate_idf_<version>.sh next to the install with
    # absolute paths baked in, and the whole tree is cached, so those paths are still
    # valid on restore. Sourcing it yields a working idf.py without the action.
    # PATH entries it adds for pruned tools (esp-clang, the GDBs, OpenOCD, the ULP
    # toolchain) simply do not resolve, which is harmless.
    - name: Activate cached ESP-IDF
      if: ${{ steps.idf-cache.outputs.cache-hit == 'true' && inputs.lookup-only != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # A candidate directory with no match leaves the glob unexpanded, so guard with
        # -f and keep the test out of an && chain, which would trip `set -e`.
        act=""
        for c in /tmp/esp /opt/esp "$HOME/.espressif" "$HOME/.espressif/tools"; do
          for f in "$c"/activate_idf_*.sh; do
            if [ -f "$f" ]; then
              act="$f"
              break 2
            fi
          done
        done
        if [ -z "$act" ]; then
          echo "::error::ESP-IDF cache was restored but no activate_idf_*.sh was found in it."
          exit 1
        fi
        echo "activating $act"

        # `-e` is the script's own non-interactive mode: it prints KEY=VALUE lines instead
        # of mutating the shell. Sourcing it is not an option here - it refuses to run
        # unless $0 is a shell name, which it is not inside a GitHub step - and it also
        # reads $ZSH_VERSION without a default, which trips `set -u`.
        env_dump="$(sh "$act" -e)"
        if [ -z "$env_dump" ]; then
          echo "::error::$act produced no environment."
          exit 1
        fi

        # Its PATH= line carries only the tool directories to prepend; SYSTEM_PATH is the
        # caller's own PATH and must not be echoed back.
        printf '%s\n' "$env_dump" | while IFS= read -r line; do
          case "$line" in
            PATH=*)
              printf '%s\n' "${line#PATH=}" | tr ':' '\n' | grep -v '^$' >> "$GITHUB_PATH"
              ;;
            SYSTEM_PATH=*|'') ;;
            *=*)
              echo "$line" >> "$GITHUB_ENV"
              ;;
          esac
        done

        idf_path="$(printf '%s\n' "$env_dump" | sed -n 's/^IDF_PATH=//p' | head -1)"
        if [ -z "$idf_path" ]; then
          echo "::error::$act did not report IDF_PATH."
          exit 1
        fi
        # idf.py lives in $IDF_PATH/tools and is not on the tool PATH the script emits.
        # scripts/build.py prefers the wrapper when it can find it there.
        echo "$idf_path/tools" >> "$GITHUB_PATH"
        echo "activated ESP-IDF at $idf_path"

    # ccache is the one build prerequisite the IDF tree does not carry - cmake, ninja and
    # python all come from it. Installed only when absent, so the warm path normally
    # touches apt not at all, and at worst fetches 592 KB rather than the action's ~15 MB.
    - name: Ensure ccache is present
      if: ${{ inputs.lookup-only != 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        if command -v ccache >/dev/null 2>&1; then
          echo "ccache present: $(ccache --version | head -1)"
        else
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ccache
        fi

    # Report what the install actually weighs, per directory. This is the ground truth
    # for the prune list below: if a warm run shows the install step taking minutes
    # again, the installer is re-fetching something pruned here and that entry should be
    # taken off the list.
    - name: Measure ESP-IDF install
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        for root in /tmp/esp /opt/esp "$HOME/.espressif"; do
          [ -d "$root" ] || continue
          echo "::group::$root"
          du -sh "$root" 2>/dev/null || true
          du -sh "$root"/* 2>/dev/null | sort -rh | head -20 || true
          if [ -d "$root/tools" ]; then
            echo "-- tools --"
            du -sh "$root"/tools/* 2>/dev/null | sort -rh | head -20 || true
          fi
          echo "::endgroup::"
        done

    # Trim the install before it is cached. Only reached on a cache miss, which is also
    # the only run that saves.
    #
    # Measured on a runner, the install is 7.7 GB under /tmp/esp plus 1.1 GB of archives
    # under ~/.espressif. What is removed, and why it is safe:
    #
    #   dist/           1.1 GB of download archives, already extracted into the tool
    #                   directories. idf_tools ships --remove-archives for exactly this,
    #                   and decides whether a tool needs installing from the extracted
    #                   <name>/<version> directory, not from dist/.
    #   esp-clang       1.9 GB, plus 335 MB of esp-clang-libs. Only clang-tidy and
    #                   `idf.py clang-check` use it; cpp-linter runs with tidy-checks '-*'
    #                   and the firmware is built with gcc, so nothing invokes it.
    #   *-gdb           247 MB of debuggers; nothing debugs on a runner.
    #   openocd-esp32   on-target flashing/debugging; CI never touches hardware.
    #   esp32ulp-elf    ULP coprocessor toolchain. No board enables the ULP - if one ever
    #                   does, drop it from the list or its build will fail to find the
    #                   assembler.
    #
    # The gcc toolchains are NOT pruned: xtensa-esp-elf builds 12 of the 13 boards and
    # riscv32-esp-elf builds the ESP32-C3.
    #
    # Tool directories sit directly under the install root on a runner
    # (/tmp/esp/esp-clang) but under a tools/ subdirectory in a local EIM install
    # (~/.espressif/tools/esp-clang), so both layouts are checked. By name rather than by
    # glob, so xtensa-esp-elf-gdb can be removed without ever putting xtensa-esp-elf at
    # risk.
    - name: Prune unused toolchains before caching
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        total=0
        drop() {
          [ -e "$1" ] || return 0
          local kb
          kb=$(du -sk "$1" 2>/dev/null | cut -f1) || kb=0
          rm -rf "$1"
          total=$((total + kb))
          echo "  removed $(printf '%6s' "$((kb / 1024))MB")  $1"
        }
        for root in /tmp/esp /opt/esp "$HOME/.espressif"; do
          [ -d "$root" ] || continue
          echo "pruning $root"
          # Download archives, already extracted into the tool directories.
          drop "$root/dist"
          for name in esp-clang esp-clang-libs openocd-esp32 esp32ulp-elf \
                      xtensa-esp-elf-gdb riscv32-esp-elf-gdb; do
            drop "$root/$name"
            drop "$root/tools/$name"
          done
        done
        echo "pruned $((total / 1024)) MB in total"

    - name: Save ESP-IDF install
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' && inputs.save-cache == 'true' }}
      uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: |
          /tmp/esp
          /opt/esp
          ~/.espressif
        key: esp-idf-${{ runner.os }}-${{ inputs.idf-version }}-5
