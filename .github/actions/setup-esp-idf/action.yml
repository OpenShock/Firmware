name: setup-esp-idf
description: >-
  Install a pinned native ESP-IDF toolchain, cached, and put its idf.py wrapper and a
  bundled ccache on PATH. Shared by every job that runs idf.py.
inputs:
  idf-version:
    description: 'ESP-IDF version to install (EIM version tag).'
    required: false
    default: 'v6.1'

outputs:
  version:
    description: 'The ESP-IDF version installed, for keying caches of what it builds.'
    value: ${{ inputs.idf-version }}

runs:
  using: composite
  steps:
    # Restore and save are split so the prune below lands between them. Missing paths are skipped.
    # No restore-keys: a partial match would run the installer over a stale tree and save the layering.
    - name: Restore ESP-IDF install
      id: idf-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          /tmp/esp
          /opt/esp
          ~/.espressif
        # Bump the trailing number to invalidate; the save step below repeats this key.
        key: esp-idf-${{ runner.os }}-${{ inputs.idf-version }}-6

    # Cache miss only: the action re-runs apt and re-prepares the clone even over a complete tree.
    # v1 is a moving branch (no release tags), pinned by SHA.
    - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae  # v1
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      with:
        version: ${{ inputs.idf-version }}

    # The cached tree carries EIM's activate_idf_<version>.sh with absolute paths that are still
    # valid on restore. PATH entries for pruned tools do not resolve, which is harmless.
    - name: Activate cached ESP-IDF
      if: ${{ steps.idf-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: |
        set -euo pipefail
        # Guard with -f: an unmatched glob stays unexpanded.
        act=""
        for c in /tmp/esp /opt/esp "$HOME/.espressif" "$HOME/.espressif/tools"; do
          for f in "$c"/activate_idf_*.sh; do
            if [ -f "$f" ]; then
              act="$f"
              break 2
            fi
          done
        done
        if [ -z "$act" ]; then
          echo "::error::ESP-IDF cache was restored but no activate_idf_*.sh was found in it."
          exit 1
        fi
        echo "activating $act"

        # -e prints KEY=VALUE lines instead of mutating the shell; sourcing it refuses to run
        # inside a step ($0 is not a shell name) and trips set -u on $ZSH_VERSION.
        env_dump="$(sh "$act" -e)"
        if [ -z "$env_dump" ]; then
          echo "::error::$act produced no environment."
          exit 1
        fi

        # PATH= holds only the directories to prepend; SYSTEM_PATH is the caller's own PATH.
        printf '%s\n' "$env_dump" | while IFS= read -r line; do
          case "$line" in
            PATH=*)
              printf '%s\n' "${line#PATH=}" | tr ':' '\n' | grep -v '^$' >> "$GITHUB_PATH"
              ;;
            SYSTEM_PATH=*|'') ;;
            *=*)
              echo "$line" >> "$GITHUB_ENV"
              ;;
          esac
        done

        idf_path="$(printf '%s\n' "$env_dump" | sed -n 's/^IDF_PATH=//p' | head -1)"
        if [ -z "$idf_path" ]; then
          echo "::error::$act did not report IDF_PATH."
          exit 1
        fi
        # idf.py is in $IDF_PATH/tools, which the script does not emit; scripts/build.py prefers it.
        echo "$idf_path/tools" >> "$GITHUB_PATH"
        echo "activated ESP-IDF at $idf_path"

    # What the fresh install weighs per directory, to check the prune list against.
    - name: Measure ESP-IDF install
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        for root in /tmp/esp /opt/esp "$HOME/.espressif"; do
          [ -d "$root" ] || continue
          echo "::group::$root"
          du -sh "$root" 2>/dev/null || true
          du -sh "$root"/* 2>/dev/null | sort -rh | head -20 || true
          if [ -d "$root/tools" ]; then
            echo "-- tools --"
            du -sh "$root"/tools/* 2>/dev/null | sort -rh | head -20 || true
          fi
          echo "::endgroup::"
        done

    # Trim what no CI build uses before caching: download archives (already extracted), esp-clang
    # (the firmware builds with gcc), the GDBs and OpenOCD (no hardware), and the ULP toolchain.
    # No board enables the ULP; one that does must take esp32ulp-elf off this list.
    # Never prune the gcc toolchains (xtensa-esp-elf, riscv32-esp-elf). Removal is by exact name so
    # xtensa-esp-elf-gdb cannot take xtensa-esp-elf with it; runners use <root>/<tool>, EIM <root>/tools/<tool>.
    - name: Prune unused toolchains before caching
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        total=0
        drop() {
          [ -e "$1" ] || return 0
          local kb
          kb=$(du -sk "$1" 2>/dev/null | cut -f1) || kb=0
          rm -rf "$1"
          total=$((total + kb))
          echo "  removed $(printf '%6s' "$((kb / 1024))MB")  $1"
        }
        for root in /tmp/esp /opt/esp "$HOME/.espressif"; do
          [ -d "$root" ] || continue
          echo "pruning $root"
          drop "$root/dist"
          for name in esp-clang esp-clang-libs openocd-esp32 esp32ulp-elf \
                      xtensa-esp-elf-gdb riscv32-esp-elf-gdb; do
            drop "$root/$name"
            drop "$root/tools/$name"
          done
        done
        echo "pruned $((total / 1024)) MB in total"

    # ccache is the one build prerequisite the IDF tree lacks, so a pinned static build is cached with it
    # and a warm run never touches apt.
    - name: Bundle ccache into the install
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        CCACHE_VERSION: '4.14.1'
        CCACHE_SHA256: 'fa1443c9fbea879c9bff6619d1284eda3102992e91831b9f6e546879972195cc'
      run: |
        set -euo pipefail
        name="ccache-${CCACHE_VERSION}-linux-x86_64-musl-static"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache.tar.xz" \
          "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${name}.tar.xz"
        echo "${CCACHE_SHA256}  $RUNNER_TEMP/ccache.tar.xz" | sha256sum -c -
        mkdir -p /tmp/esp/ccache
        tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C /tmp/esp/ccache --strip-components=1 "${name}/ccache"
        /tmp/esp/ccache/ccache --version | head -1

    # Only develop saves: a cache saved on another ref is restorable by that ref alone, and each one
    # would be another ~1.8 GB of the repository's 10 GB. Concurrent misses race; the losers only warn.
    # The cost, accepted for that limit: after an eviction (7 days unused) or a key bump, every tag
    # and PR build installs cold and saves nothing until a develop push next runs this action.
    # The alternative, if that bites, is to let one nominated job save on a miss from any ref.
    - name: Save ESP-IDF install
      if: >-
        ${{ steps.idf-cache.outputs.cache-hit != 'true'
        && github.ref == 'refs/heads/develop' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          /tmp/esp
          /opt/esp
          ~/.espressif
        key: esp-idf-${{ runner.os }}-${{ inputs.idf-version }}-6

    - name: Put ccache on PATH
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -x /tmp/esp/ccache/ccache ]; then
          echo "::error::The ESP-IDF install carries no ccache; bump the cache key in setup-esp-idf to rebuild it."
          exit 1
        fi
        echo /tmp/esp/ccache >> "$GITHUB_PATH"
