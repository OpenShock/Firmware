name: setup-esp-idf
description: >-
  Install a pinned native ESP-IDF toolchain and put its `idf.py` wrapper on PATH.
  scripts/build.py invokes that wrapper, which activates the tool + venv
  environment itself. Shared by every job that runs idf.py; replaces pio-cache.
inputs:
  idf-version:
    description: 'ESP-IDF version to install (EIM version tag).'
    required: false
    default: 'v6.0.2'

runs:
  using: composite
  steps:
    # Cache the whole ESP-IDF install so a warm run skips the multi-minute IDF
    # source clone + submodule fetch + toolchain download. On Linux this action
    # installs the source (and its submodules) under /tmp/esp/idf and the tools /
    # Python venv under /tmp/esp (older layouts used /opt/esp or ~/.espressif, so
    # cache all three - missing paths are skipped). Keyed by version. Bump the
    # trailing number to invalidate a stale cache (keys are immutable once saved).
    - name: Cache ESP-IDF install
      uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
      with:
        path: |
          /tmp/esp
          /opt/esp
          ~/.espressif
        key: esp-idf-${{ runner.os }}-${{ inputs.idf-version }}-2
        restore-keys: |
          esp-idf-${{ runner.os }}-${{ inputs.idf-version }}-

    # Installs ESP-IDF, sets IDF_PATH, and puts the `idf.py` wrapper on PATH for
    # later steps. v1 is a moving branch (no release tags), pinned by SHA.
    - name: Install ESP-IDF
      uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae  # v1
      with:
        version: ${{ inputs.idf-version }}
