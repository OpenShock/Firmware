name: setup-esp-idf
description: >-
  Install a pinned native ESP-IDF toolchain, cached, and put its idf.py wrapper and a
  bundled ccache on PATH. Shared by every job that runs idf.py.
inputs:
  idf-version:
    description: 'ESP-IDF version to install (EIM version tag).'
    required: false
    default: 'v6.1'

outputs:
  version:
    description: 'The ESP-IDF version installed, for keying caches of what it builds.'
    value: ${{ inputs.idf-version }}

runs:
  using: composite
  steps:
    # Restore and save are split so the prune below lands between them. Missing paths are skipped.
    # No restore-keys: a partial match would run the installer over a stale tree and save the layering.
    # Bump the trailing number to invalidate.
    - name: Compute cache key
      id: key
      shell: bash
      env:
        IDF_VERSION: ${{ inputs.idf-version }}
      run: echo "key=esp-idf-$RUNNER_OS-$IDF_VERSION-6" >> "$GITHUB_OUTPUT"

    - name: Restore ESP-IDF install
      id: idf-cache
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          /tmp/esp
          /opt/esp
          ~/.espressif
        key: ${{ steps.key.outputs.key }}

    # Cache miss only: the action re-runs apt and re-prepares the clone even over a complete tree.
    # v1 is a moving branch (no release tags), pinned by SHA.
    - uses: espressif/install-esp-idf-action@8fc05d1470d5591417e7a3707a1f2bec178db4ae  # v1
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      with:
        version: ${{ inputs.idf-version }}

    # The cached tree carries EIM's activate_idf_<version>.sh with absolute paths that are still
    # valid on restore. PATH entries for pruned tools do not resolve, which is harmless.
    - name: Activate cached ESP-IDF
      if: ${{ steps.idf-cache.outputs.cache-hit == 'true' }}
      shell: bash
      run: "$GITHUB_ACTION_PATH/../../scripts/activate_idf.sh"

    # Drops what no CI build uses (archives, clang, GDBs, OpenOCD, ULP) by exact name, never the gcc toolchains.
    # A board that enables the ULP must take esp32ulp-elf off this list.
    - name: Prune unused toolchains before caching
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      shell: bash
      run: |
        set -uo pipefail
        total=0
        drop() {
          [ -e "$1" ] || return 0
          local kb
          kb=$(du -sk "$1" 2>/dev/null | cut -f1) || kb=0
          rm -rf "$1"
          total=$((total + kb))
          echo "  removed $(printf '%6s' "$((kb / 1024))MB")  $1"
        }
        for root in /tmp/esp /opt/esp "$HOME/.espressif"; do
          [ -d "$root" ] || continue
          echo "pruning $root"
          drop "$root/dist"
          for name in esp-clang esp-clang-libs openocd-esp32 esp32ulp-elf \
                      xtensa-esp-elf-gdb riscv32-esp-elf-gdb; do
            drop "$root/$name"
            drop "$root/tools/$name"
          done
        done
        echo "pruned $((total / 1024)) MB in total"

    # A pinned static ccache, cached with the install so a warm run never touches apt.
    - name: Bundle ccache into the install
      if: ${{ steps.idf-cache.outputs.cache-hit != 'true' }}
      shell: bash
      env:
        CCACHE_VERSION: '4.14.1'
        CCACHE_SHA256: 'fa1443c9fbea879c9bff6619d1284eda3102992e91831b9f6e546879972195cc'
      run: |
        set -euo pipefail
        name="ccache-${CCACHE_VERSION}-linux-x86_64-musl-static"
        curl -fsSL --retry 3 -o "$RUNNER_TEMP/ccache.tar.xz" \
          "https://github.com/ccache/ccache/releases/download/v${CCACHE_VERSION}/${name}.tar.xz"
        echo "${CCACHE_SHA256}  $RUNNER_TEMP/ccache.tar.xz" | sha256sum -c -
        mkdir -p /tmp/esp/ccache
        tar -xJf "$RUNNER_TEMP/ccache.tar.xz" -C /tmp/esp/ccache --strip-components=1 "${name}/ccache"
        /tmp/esp/ccache/ccache --version | head -1

    # Only develop saves: a cache saved on another ref is restorable by that ref alone, and costs ~1.8 GB of the 10 GB.
    - name: Save ESP-IDF install
      if: >-
        ${{ steps.idf-cache.outputs.cache-hit != 'true'
        && github.ref == 'refs/heads/develop' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
      with:
        path: |
          /tmp/esp
          /opt/esp
          ~/.espressif
        key: ${{ steps.key.outputs.key }}

    - name: Put ccache on PATH
      shell: bash
      run: |
        set -euo pipefail
        if [ ! -x /tmp/esp/ccache/ccache ]; then
          echo "::error::The ESP-IDF install carries no ccache; bump the cache key in setup-esp-idf to rebuild it."
          exit 1
        fi
        echo /tmp/esp/ccache >> "$GITHUB_PATH"
