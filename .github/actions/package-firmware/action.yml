name: package-firmware
description: >-
  Turn the per-variant builds into per-board firmware: scripts/package_boards.py stamps
  each board, scripts/merge_image.py merges it with static0. Needs esptool, not ESP-IDF.
inputs:
  version:
    description: 'Firmware version'
    required: true
  boards:
    description: 'Newline-separated board names to package'
    required: true

runs:
  using: composite
  steps:
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
      with:
        python-version-file: .github/scripts/.python-version
        cache: 'pip'

    - name: Install Python dependencies
      shell: bash
      run: pip install -r requirements.txt

    # Each variant artifact holds one <variant-id>/ directory, so merging them keeps variants apart.
    - name: Download variant builds
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        pattern: variant_*
        path: variants
        merge-multiple: true

    - name: Download static filesystem image
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        name: firmware_staticfs
        path: staticfs

    - name: Stamp every board
      shell: bash
      env:
        BOARDS: ${{ inputs.boards }}
      run: python scripts/package_boards.py --variants variants --board "$BOARDS" --out boards-out

    # One invocation for every board; merge_image.py expands {board} in --bindir and --output.
    - name: Merge partitions
      shell: bash
      env:
        BOARDS: ${{ inputs.boards }}
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        python scripts/merge_image.py \
          --board "$BOARDS" \
          --bindir 'boards-out/{board}' \
          --staticfs staticfs/staticfs.bin \
          --output "merged/OpenShock_{board}_${VERSION}.bin"

    # One artifact holding a directory per board: what repo_server_publish.py uploads for each.
    - name: Upload per-board images
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: firmware_boards
        path: boards-out
        retention-days: 7
        if-no-files-found: error

    - name: Upload merged firmware binaries
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
      with:
        name: firmware_merged
        path: merged/OpenShock_*.bin
        retention-days: 7
        if-no-files-found: error
