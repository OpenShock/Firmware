name: repo-server-publish
description: >-
  Drives one phase of a firmware release on the repository server.
  `init` opens the release and returns its id; `publish` uploads every board's artifacts and promotes it; `abort` closes a release whose build never got that far.

outputs:
  release-id:
    description: 'The staged release id, set by `init` and passed to a later `publish` or `abort`.'
    value: ${{ steps.run.outputs.release-id }}
  outcome-unknown:
    description: "'true' when `publish` got no response, so the release may be live and must not be aborted."
    value: ${{ steps.run.outputs.outcome-unknown }}

inputs:
  server-url:
    description: 'Base URL of the repository server'
    required: true
  token:
    description: 'OIDC token from the repo-server-token action'
    required: true
  version:
    description: 'Firmware version, strict semver. Required by `init`.'
    required: false
  channel:
    description: 'Release channel: stable, beta or develop. Required by `init`.'
    required: false
  boards:
    description: 'Newline-separated boards to publish. Required by `init` and `publish`.'
    required: false
  release-id:
    description: 'Release opened by an earlier `init`. Required by `publish` and `abort`.'
    required: false
  mode:
    description: '`init` opens the release; `publish` uploads and promotes it; `abort` closes one the build never reached.'
    required: true

runs:
  using: composite
  steps:

    - name: Download firmware artifacts
      if: ${{ inputs.mode == 'publish' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        path: artifacts
        pattern: firmware_*

    # No Python setup: callers run repo-server-token first, which installs the pinned dependencies.
    - name: Run the ${{ inputs.mode }} phase
      id: run
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
        TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
        BOARDS: ${{ inputs.boards }}
        RELEASE_ID: ${{ inputs.release-id }}
        MODE: ${{ inputs.mode }}
      run: python .github/scripts/repo_server_publish.py
