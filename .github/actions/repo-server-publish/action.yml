name: repo-server-publish
description: >-
  Stages a firmware release on the repository server: init, upload every board's artifacts, then promote or discard.
  `mode` picks the ending; nothing before it differs, so a dry run exercises the whole publish path.

inputs:
  server-url:
    description: 'Base URL of the repository server'
    required: true
  token:
    description: 'OIDC token from the repo-server-token action'
    required: true
  version:
    description: 'Firmware version, strict semver'
    required: true
  channel:
    description: 'Release channel: stable, beta or develop'
    required: true
  boards:
    description: 'Newline-separated boards to publish'
    required: true
  mode:
    description: '`publish` promotes the release; `dry-run` aborts it, leaving nothing staged.'
    required: false
    default: 'dry-run'
  changelog-file:
    description: 'Markdown file to take the newest release-notes section from'
    required: false
    default: 'CHANGELOG.md'
  nofail:
    description: >-
      Pass ?nofail to init, so an unparseable changelog parks the release in `editing` instead of failing the build.
    required: false
    default: 'false'

runs:
  using: composite
  steps:

    - name: Download firmware artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        path: artifacts
        pattern: firmware_*

    - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
      with:
        python-version-file: .github/scripts/.python-version
        cache: 'pip'
        cache-dependency-path: .github/scripts/requirements.txt

    # This job holds the publish credential, so pip installs are pinned by digest.
    - name: Install script dependencies
      shell: bash
      run: pip install --require-hashes -r .github/scripts/requirements.txt

    - name: Stage and ${{ inputs.mode == 'publish' && 'publish' || 'discard' }} release
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
        TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
        BOARDS: ${{ inputs.boards }}
        MODE: ${{ inputs.mode }}
        CHANGELOG_FILE: ${{ inputs.changelog-file }}
        NOFAIL: ${{ inputs.nofail }}
        ARTIFACTS_DIR: artifacts
      run: python .github/scripts/repo_server_publish.py
