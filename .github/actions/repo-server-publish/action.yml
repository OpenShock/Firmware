name: repo-server-publish
description: >-
  Drives one phase of a firmware release on the repository server.
  `init` opens the release and returns its id; `publish` and `dry-run` upload every board's artifacts and then promote or discard; `abort` closes a release whose build never got that far.
  Nothing before the ending differs between `publish` and `dry-run`, so a dry run exercises the whole publish path.

outputs:
  release-id:
    description: 'The staged release id, set by `init` and passed to a later `publish`, `dry-run` or `abort`.'
    value: ${{ steps.run.outputs.release-id }}

inputs:
  server-url:
    description: 'Base URL of the repository server'
    required: true
  token:
    description: 'OIDC token from the repo-server-token action'
    required: true
  version:
    description: 'Firmware version, strict semver. Required by `init`.'
    required: false
  channel:
    description: 'Release channel: stable, beta or develop. Required by `init`.'
    required: false
  boards:
    description: 'Newline-separated boards to publish. Required by `init`, `publish` and `dry-run`.'
    required: false
  release-id:
    description: 'Release opened by an earlier `init`. Required by `publish`, `dry-run` and `abort`.'
    required: false
  mode:
    description: '`init` opens the release; `publish` promotes it; `dry-run` aborts it, leaving nothing staged; `abort` closes one the build never reached.'
    required: false
    default: 'dry-run'

runs:
  using: composite
  steps:

    - name: Download firmware artifacts
      if: ${{ inputs.mode == 'publish' || inputs.mode == 'dry-run' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        path: artifacts
        pattern: firmware_*

    # No Python setup: callers run repo-server-token first, which installs the pinned dependencies.
    - name: Run the ${{ inputs.mode }} phase
      id: run
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
        TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
        BOARDS: ${{ inputs.boards }}
        RELEASE_ID: ${{ inputs.release-id }}
        MODE: ${{ inputs.mode }}
        ARTIFACTS_DIR: artifacts
      run: python .github/scripts/repo_server_publish.py
