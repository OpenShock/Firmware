name: repo-server-publish
description: Drive one phase of a firmware release on the repository server (init, publish or abort)
inputs:
  server-url:
    required: true
    description: 'Base URL of the repository server'
  token:
    required: true
    description: 'OIDC token from the repo-server-token action'
  mode:
    required: true
    description: 'init opens the release, publish uploads and promotes it, abort closes one the build never reached'
  version:
    required: false
    description: 'Firmware version, strict semver (init; publish, where it picks the staticfs image)'
  channel:
    required: false
    description: 'Release channel: stable, beta or develop (init)'
  boards:
    required: false
    description: 'Newline-separated boards to publish (init, publish)'
  release-id:
    required: false
    description: 'Release opened by an earlier init (publish, abort)'

outputs:
  release-id:
    description: 'The staged release id, set by init'
    value: ${{ steps.run.outputs.release-id }}
  outcome-unknown:
    description: 'true when publish got no response, so the release may be live and must not be aborted'
    value: ${{ steps.run.outputs.outcome-unknown }}

runs:
  using: composite
  steps:
    - name: Download firmware artifacts
      if: ${{ inputs.mode == 'publish' }}
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
      with:
        path: artifacts
        pattern: firmware_*

    # No Python setup, callers run repo-server-token first which installs the dependencies
    - name: Run the ${{ inputs.mode }} phase
      id: run
      shell: bash
      env:
        SERVER_URL: ${{ inputs.server-url }}
        TOKEN: ${{ inputs.token }}
        VERSION: ${{ inputs.version }}
        CHANNEL: ${{ inputs.channel }}
        BOARDS: ${{ inputs.boards }}
        RELEASE_ID: ${{ inputs.release-id }}
        MODE: ${{ inputs.mode }}
      run: python scripts/repo_server_publish.py
