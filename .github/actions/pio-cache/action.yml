name: pio-cache
description: >-
  Restore/save PlatformIO caches, split by what actually varies per board so the
  matrix does not blow past the Actions cache storage limit.
inputs:
  env:
    required: true
    description: 'PlatformIO environment (the env:<name>) being built'

runs:
  using: composite
  steps:
    # The only thing that differs across boards in ~/.platformio is the toolchain
    # + precompiled framework libs, and those track the *chip*, not the board.
    # Resolve the chip for this env so packages can be keyed per-chip (shared by
    # every board of that chip) instead of per-board. Uses the runner's system
    # python3 so it can run before setup-python.
    - name: Resolve chip for cache key
      id: chip
      shell: bash
      env:
        PIO_ENV: ${{ inputs.env }}
      run: |
        chip=$(python3 - <<'PY'
        import configparser, os
        cp = configparser.ConfigParser(interpolation=None, inline_comment_prefixes=(';',))
        cp.read('platformio.ini')
        print(cp.get(f"env:{os.environ['PIO_ENV']}", 'custom_openshock.chip', fallback='unknown').strip())
        PY
        )
        echo "chip=$chip" >> "$GITHUB_OUTPUT"
        echo "env ${PIO_ENV} -> chip ${chip}"

    # Platform is identical for every board; packages (toolchain + framework libs)
    # vary per chip. Keying by chip means N boards on one chip share a single
    # entry instead of each storing its own copy. ~/.platformio/.cache (the
    # downloaded archives) is deliberately NOT cached: the extracted packages
    # cache already avoids re-downloads, and caching it roughly doubled the size.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.platformio/platforms
          ~/.platformio/packages
        key: pio-pkgs-${{ runner.os }}-${{ steps.chip.outputs.chip }}-${{ hashFiles('platformio.ini', 'requirements.txt') }}
        restore-keys: |
          pio-pkgs-${{ runner.os }}-${{ steps.chip.outputs.chip }}-

    # Library sources live in per-env directories. lib_deps is global so the
    # contents are identical across boards, but PlatformIO stores them under
    # .pio/libdeps/<env>, so key them per-env. This slice is small.
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: .pio/libdeps
        key: pio-libdeps-${{ runner.os }}-${{ inputs.env }}-${{ hashFiles('platformio.ini') }}
        restore-keys: |
          pio-libdeps-${{ runner.os }}-${{ inputs.env }}-
