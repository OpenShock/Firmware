name: 'CodeQL'

on:
  push:
    branches: ['master', 'develop']
  pull_request:
    branches: ['master', 'develop']
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze-js-py:
    name: Analyze JS/PY
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript', 'python']

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0  # codeql-bundle-v2.27.1
        with:
          languages: ${{ matrix.language }}

      # No build step: JavaScript/TypeScript and Python are extracted from source.
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0  # codeql-bundle-v2.27.1
        with:
          category: '/language:${{matrix.language}}'

  # Weekly or on demand only: the C/C++ analysis has to compile the firmware.
  analyze-cpp:
    name: Analyze C/C++
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: 'ubuntu-latest'
    timeout-minutes: 15
    permissions:
      actions: read
      contents: read
      security-events: write

    env:
      language: 'c-cpp'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The firmware needs only the flatbuffers runtime submodule.
      - name: Fetch flatbuffers submodule
        run: git submodule update --init --depth 1 components/flatbuffers/flatbuffers

      - name: Initialize CodeQL
        uses: github/codeql-action/init@416ff0dea110f80f0f56f0046500dbf7420e4bb0  # codeql-bundle-v2.27.1
        with:
          languages: ${{ env.language }}

      # build, not configure: the tracer must see the compiler run. The version is a placeholder.
      - uses: ./.github/actions/build-compilationdb
        with:
          version: 0.0.0-codeql+build
          mode: build

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@416ff0dea110f80f0f56f0046500dbf7420e4bb0  # codeql-bundle-v2.27.1
        with:
          category: '/language:${{ env.language }}'
