on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Base URL of the repository server to check'
        required: false
        default: 'https://repo.openshock.dev'
      audience:
        description: 'OIDC audience, must match OPENSHOCK__CICD__AUDIENCE on the server'
        required: false
        default: 'openshock-repository-server'
  # Any branch, whenever the repository-server plumbing changes. workflow_dispatch only
  # offers a workflow that already exists on the default branch, so without this the check
  # could not be run from the branch developing it.
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/repo-server-preflight.yml'
      - '.github/actions/repo-server-*/**'

name: repo-server-preflight

# The cheap half of repository-server testing, and the only half that runs on any branch.
#
# Answers two questions, in seconds, without building anything: can this repository publish
# firmware at all, and does the server know every board it would publish. Both are server-side
# state an admin can change underneath CI - a scope revoked, a board not yet added - so being
# able to re-check them without waiting on a 30-minute build is the point.
#
# It reads only. Everything that writes lives in ci-build's repo-server job, because that is
# where the built artifacts are:
#
#   preflight (here)        server reachable, repo authorised, catalog complete
#   ci-build, dry run       + init, upload every board, server-side hash verification
#   ci-build, publish       + promote, then read the release back and compare served bytes
#
# Each row is the row above plus more, so this workflow passing is necessary and not
# sufficient. ci-build runs the same preflight action before it uploads anything.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  preflight:
    name: Repository server preflight
    runs-on: ubuntu-slim # lightweight: curl + jq, checkout only for the board list
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            boards

      # Every board this repository builds, which is what a full release would declare.
      # ci-build takes the same list from get-vars; here it is read straight off disk so
      # the check stands alone.
      - name: Collect board list
        id: boards
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'list<<EOF'
            for f in boards/*.defaults; do basename "$f" .defaults; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/repo-server-token
        id: token
        with:
          audience: ${{ inputs.audience || 'openshock-repository-server' }}

      - uses: ./.github/actions/repo-server-preflight
        with:
          server-url: ${{ inputs.server_url || 'https://repo.openshock.dev' }}
          token: ${{ steps.token.outputs.token }}
          boards: ${{ steps.boards.outputs.list }}

      - name: Summary
        if: always()
        shell: bash
        env:
          SERVER_URL: ${{ inputs.server_url || 'https://repo.openshock.dev' }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "## Repository server preflight"
            echo
            echo "Server \`$SERVER_URL\`: **$RESULT**"
            echo
            echo "Checks: server reachable, ${GITHUB_REPOSITORY} authorised to publish firmware,"
            echo "every built board present in the catalog. See the step logs for which one failed."
          } >> "$GITHUB_STEP_SUMMARY"
