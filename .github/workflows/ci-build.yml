# Compiles once per build variant (scripts/utils/boards.py) and stamps each board from it. Runs on:
#   - release tags: every board, published to prod;
#   - nightly on develop when firmware sources changed, published to prod;
#   - pull requests: one canary board, or every board with the ci:full-build label;
#   - dispatch: every board, on demand.
# Per-commit checks are host-tests.yml, script-tests.yml, frontend-checks.yml and cpp-linter.yml.
name: ci-build

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches:
      - master
      - beta
      - develop
    # labeled so that adding ci:full-build upgrades the PR's build; the gate ignores every other label.
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      server:
        description: 'Repository server to publish to (prod is honoured only when running against a tag)'
        required: false
        type: choice
        default: dev
        options: [dev, prod]
      channel:
        description: 'Channel to publish onto (derive = the channel the ref maps to)'
        required: false
        type: choice
        default: derive
        options: [derive, develop, beta, stable]
  schedule:
    - cron: '0 3 * * *' # Runs on the default branch, develop

# Per ref. A label other than ci:full-build gets its own group, so its no-op run does not cancel the PR's build.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'ci:full-build'
    && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # Decides build, publish, the server and the boards (scripts/ci_build_gate.py).
  gate:
    runs-on: ubuntu-latest # ships the pinned Python; ubuntu-slim would download it every run
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      publish: ${{ steps.decide.outputs.publish }}
      server: ${{ steps.decide.outputs.server }}
      boards: ${{ steps.decide.outputs.boards }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts

      - uses: ./.github/actions/install-python-deps

      - name: Decide build and publish
        id: decide
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/ci_build_gate.py

  # Version, channel, boards, and the build variants they need (scripts/get_vars.py).
  plan:
    needs: [gate]
    if: ${{ needs.gate.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get-vars.outputs.version }}
      release-channel: ${{ steps.get-vars.outputs.release-channel }}
      board-list: ${{ steps.get-vars.outputs.board-list }}
      variant-matrix: ${{ steps.get-vars.outputs.variant-matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github
            .changes
            boards
            scripts

      - uses: ./.github/actions/install-python-deps

      # The next version from .changes/; status mode works on every branch and creates no tag.
      - name: Compute next version
        id: relmeta
        uses: OpenShock/release-tool@ea651e8c10372a10b6f452dcb34c38e60a72dc1f  # v0.5.1
        with:
          mode: status

      - name: Get variables
        id: get-vars
        env:
          RELEASE_NEXT_VERSION: ${{ steps.relmeta.outputs.next-version }}
          RELEASE_SKIP: ${{ steps.relmeta.outputs.skip }}
          CHANNEL_INPUT: ${{ inputs.channel }}
          BOARDS_INPUT: ${{ needs.gate.outputs.boards }}
        run: python scripts/get_vars.py

  # Opens and reserves the release before anything is built, so the server's checks fail in a minute, not after the matrix.
  stage:
    name: Stage release on ${{ needs.gate.outputs.server }}
    runs-on: ubuntu-latest
    needs: [gate, plan]
    timeout-minutes: 10
    # A pull request never publishes, so no fork reaches the OIDC mint below.
    if: ${{ needs.gate.outputs.publish == 'true' }}
    # The environment carries OPENSHOCK_REPO_SERVER_URL, and repo-server-prod's reviewer approves here, before the build.
    environment: repo-server-${{ needs.gate.outputs.server }}
    permissions:
      contents: read
      id-token: write
    outputs:
      release-id: ${{ steps.stage.outputs.release-id }}
      server-url: ${{ vars.OPENSHOCK_REPO_SERVER_URL }} # For the publish and abort jobs, which run outside the environment

    steps:
      - name: Fail when the environment has no server URL
        if: ${{ vars.OPENSHOCK_REPO_SERVER_URL == '' }}
        run: |
          echo "::error::OPENSHOCK_REPO_SERVER_URL is unset on environment repo-server-$TARGET, so this build has nowhere to publish to."
          exit 1
        env:
          TARGET: ${{ needs.gate.outputs.server }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
            CHANGELOG.md

      - uses: ./.github/actions/install-python-deps

      # This repository's prod rules, which the server cannot know (stable descends from master, a draft is staged).
      - name: Apply repository publishing policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SERVER: ${{ needs.gate.outputs.server }}
          CHANNEL: ${{ needs.plan.outputs.release-channel }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: python scripts/repo_server_policy.py

      - uses: ./.github/actions/repo-server-token
        id: token

      - uses: ./.github/actions/repo-server-publish
        id: stage
        with:
          server-url: ${{ vars.OPENSHOCK_REPO_SERVER_URL }}
          token: ${{ steps.token.outputs.token }}
          version: ${{ needs.plan.outputs.version }}
          channel: ${{ needs.plan.outputs.release-channel }}
          boards: ${{ needs.plan.outputs.board-list }}
          mode: init

  # The frontend packed into the static0 image, once for every board (its checks are frontend-checks.yml's).
  # The jobs below wait on stage so a prod release is approved before compute is spent: a skipped stage
  # (nothing to publish) lets them run, a failed one stops them.
  staticfs:
    needs: [gate, stage]
    if: >-
      ${{ !cancelled()
      && needs.stage.result != 'failure'
      && needs.gate.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          sparse-checkout: |
            .github
            frontend
            scripts
            partitions

      - uses: ./.github/actions/build-frontend
        with:
          checks: 'false'

      - uses: ./.github/actions/build-staticfs

  # One unstamped compile per build variant, in parallel with staticfs.
  build:
    name: 'build (${{ matrix.chip }}: ${{ matrix.boards }})'
    runs-on: ubuntu-latest
    needs: [plan, stage]
    if: >-
      ${{ !cancelled()
      && needs.stage.result != 'failure'
      && needs.plan.result == 'success' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.variant-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/build-firmware
        with:
          variant: ${{ matrix.variant }}
          version: ${{ needs.plan.outputs.version }}
          # Never for a pull request: its code is the contributor's, so its builds upload nothing.
          diag-upload-domain: ${{ github.event_name != 'pull_request' && vars.DIAG_UPLOAD_DOMAIN || '' }}

  # Stamp every board from its variant and merge it with static0. One job: it is seconds of work per board.
  package:
    runs-on: ubuntu-latest
    needs: [plan, stage, staticfs, build]
    if: >-
      ${{ !cancelled()
      && needs.stage.result != 'failure'
      && needs.staticfs.result == 'success'
      && needs.build.result == 'success' }}
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
            boards
            partitions

      - uses: ./.github/actions/package-firmware
        with:
          version: ${{ needs.plan.outputs.version }}
          boards: ${{ needs.plan.outputs.board-list }}

      - name: Attest build provenance
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6  # v4.2.2
        with:
          subject-path: merged/OpenShock_*.bin

  # Upload every board into the staged release and publish it; fail on the first non-success.
  # Publishing consumes the version (only a maintainer can undo it). No environment: stage was the approval.
  # A plain if is safe: on a publish run nothing upstream is skipped, and a failure upstream must skip this.
  repo-server:
    name: Repository server (publish to ${{ needs.gate.outputs.server }})
    runs-on: ubuntu-latest
    needs: [gate, plan, stage, package]
    timeout-minutes: 20
    if: ${{ needs.gate.outputs.publish == 'true' }}
    permissions:
      contents: read
      id-token: write
    outputs:
      outcome-unknown: ${{ steps.publish.outputs.outcome-unknown }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts

      - uses: ./.github/actions/repo-server-token
        id: token

      - uses: ./.github/actions/repo-server-publish
        id: publish
        with:
          server-url: ${{ needs.stage.outputs.server-url }}
          token: ${{ steps.token.outputs.token }}
          release-id: ${{ needs.stage.outputs.release-id }}
          boards: ${{ needs.plan.outputs.board-list }}
          mode: publish

  # Hands the staged version back when the run fails, is cancelled or never publishes; the server's TTL is only a backstop.
  abort:
    name: Abort staged release
    runs-on: ubuntu-latest
    needs: [stage, repo-server]
    timeout-minutes: 10
    if: ${{ always() && needs.stage.outputs.release-id != '' && needs.repo-server.result != 'success' && needs.repo-server.outputs.outcome-unknown != 'true' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts

      - uses: ./.github/actions/repo-server-token
        id: token

      - uses: ./.github/actions/repo-server-publish
        with:
          server-url: ${{ needs.stage.outputs.server-url }}
          token: ${{ steps.token.outputs.token }}
          release-id: ${{ needs.stage.outputs.release-id }}
          mode: abort

  # Attaches the merged binaries to the draft release.yml staged for this tag and publishes it, after the
  # repository server, so a release never advertises what no device can fetch.
  release:
    runs-on: ubuntu-latest
    needs: [gate, plan, repo-server]
    timeout-minutes: 5
    # Pushes only trigger on release tags; a dispatch against a tag publishes without cutting a release.
    if: >-
      github.event_name == 'push'
      && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ needs.plan.outputs.version }}

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: firmware_merged

      # One per build variant, for decoding crash backtraces (build-firmware's Stage ELF)
      - name: Download ELF files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          pattern: elf_*
          merge-multiple: true

      - name: Upload binaries to staged release
        run: |
          shopt -s globstar nullglob
          files=(**/OpenShock_*.bin)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware binaries found to upload"
            exit 1
          fi
          elfs=(**/OpenShock_*.elf)
          if [ ${#elfs[@]} -eq 0 ]; then
            echo "::error::No ELF files found to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" "${elfs[@]}" --clobber

      - name: Publish the release
        run: gh release edit "$TAG" --draft=false

  # Announce to the OpenShock API last, so it never points a device at a version the server is not yet serving.
  announce:
    runs-on: ubuntu-slim # lightweight: gh + curl only
    needs: [plan, release]
    timeout-minutes: 5
    if: ${{ vars.OPENSHOCK_API_URL != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts

      - uses: ./.github/actions/repo-server-token
        id: token
        with:
          audience: openshock-release-ingest

      # release.json is the release asset release.yml staged.
      - name: Announce release to OpenShock API
        env:
          OIDC_TOKEN: ${{ steps.token.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          API_URL: ${{ vars.OPENSHOCK_API_URL }}
          TAG: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern release.json --dir .
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$API_URL/1/public/releases" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @release.json

  # develop's ruleset requires this name. It always runs and fails when any job failed or was cancelled,
  # because a skipped required check would count as passing.
  checkpoint-build:
    runs-on: ubuntu-slim
    needs: [gate, plan, stage, staticfs, build, package, repo-server, release, announce]
    if: ${{ always() }}
    timeout-minutes: 1
    steps:
      - name: Fail when a job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::A ci-build job failed or was cancelled."
          exit 1
