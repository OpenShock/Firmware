on:
  # develop does not build on push. It builds nightly (only when there are new
  # commits since the last run) or on manual dispatch. Release tags still build
  # immediately so a cut release is published.
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches:
      - master
      - beta
      - develop
    types: [opened, reopened, synchronize]
  workflow_dispatch: # Manually invoked, e.g. to force a develop build.
  schedule:
    - cron: '0 3 * * *' # Nightly develop build; the gate job skips it if idle.

name: ci-build

# PRs cancel their own superseded runs (per-ref group). Everything that can
# deploy - nightly/dispatch develop builds and release tags - shares one
# 'deploy' queue and never cancels, so runs serialize and CDN deploys never race.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  PYTHON_VERSION: 3.13

jobs:
  # Nightly (schedule) runs build only when develop advanced since the last
  # successful ci-build run. Every other trigger - release tag, PR, manual
  # dispatch - always builds.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Decide whether to build
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # Compare develop HEAD to the last successful ci-build run on develop
          # (covers both nightly and manual dispatch runs).
          last=$(gh run list --repo "$REPO" --workflow ci-build.yml \
            --branch develop --status success -L 1 --json headSha --jq '.[0].headSha // ""')
          if [ "$last" != "$SHA" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No new commits on develop since the last successful deploy (${last:-<none>}); skipping nightly build."
          fi

  getvars:
    needs: [gate]
    if: ${{ needs.gate.outputs.build == 'true' }}
    uses: ./.github/workflows/get-vars.yml

  build-frontend:
    needs: [gate]
    if: ${{ needs.gate.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          submodules: recursive
          sparse-checkout: |
            .github
            frontend

      - uses: ./.github/actions/build-frontend

  build-staticfs:
    runs-on: ubuntu-latest
    needs: [getvars, build-frontend]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
      - uses: ./.github/actions/build-staticfs
        with:
          version: ${{ needs.getvars.outputs.version }}
          skip-checkout: true

  build-firmware:
    runs-on: ubuntu-latest
    needs: [getvars]
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.getvars.outputs.board-matrix) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - uses: ./.github/actions/build-firmware
        with:
          board: ${{ matrix.board }}
          version: ${{ needs.getvars.outputs.version }}
          skip-checkout: true

  merge-partitions:
    runs-on: ubuntu-latest
    needs: [getvars, build-staticfs, build-firmware]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.getvars.outputs.board-matrix) }}

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          sparse-checkout: |
            .github
            scripts
            boards
            chips

      - uses: ./.github/actions/merge-partitions
        with:
          version: ${{ needs.getvars.outputs.version }}
          board: ${{ matrix.board }}
          skip-checkout: true

  checkpoint-build:
    runs-on: ubuntu-latest
    needs: [merge-partitions]
    timeout-minutes: 1
    steps:
      - run: echo "Builds checkpoint reached"

  # A single job owns the whole CDN deployment. Every job that declares
  # `environment:` produces one GitHub deployment record, and matrix legs each
  # count separately, so the old split (matrix upload + version-info + bump)
  # created `boards + 2` deployments per run. Collapsing the work into one
  # non-matrix job yields exactly one deployment per run. The CDN secrets/vars
  # are environment-scoped, so this job must keep `environment: cdn` to read
  # them; the environment's only protection rule is a branch policy, so nothing
  # is gated away by merging the jobs.
  cdn-deploy:
    runs-on: ubuntu-latest
    needs: [getvars, checkpoint-build]
    timeout-minutes: 20
    if: ${{ needs.getvars.outputs.should-deploy == 'true' }}
    environment: cdn
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          sparse-checkout: |
            .github

      # A beta/master deploy must have a draft release staged by release.yml for
      # this version; otherwise a stray tag push could publish firmware to the
      # CDN. develop has no releases, so it is exempt.
      - name: Require a staged draft release (beta/master only)
        if: ${{ needs.getvars.outputs.release-channel != 'develop' }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          set -euo pipefail
          isDraft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
          if [ "$isDraft" != "true" ]; then
            echo "::error::No draft release for $TAG (state: $isDraft). release.yml must stage the draft before the CDN upload runs."
            exit 1
          fi

      # Upload every board's firmware to the CDN.
      - uses: ./.github/actions/cdn-upload-firmware
        with:
          bunny-stor-hostname: ${{ vars.BUNNY_STOR_HOSTNAME }}
          bunny-stor-username: ${{ secrets.BUNNY_STOR_USERNAME }}
          bunny-stor-password: ${{ secrets.BUNNY_STOR_PASSWORD }}
          fw-version: ${{ needs.getvars.outputs.version }}
          boards: ${{ needs.getvars.outputs.board-list }}

      # Upload the version manifest (boards.txt) alongside the firmware.
      - uses: ./.github/actions/cdn-upload-version-info
        with:
          bunny-stor-hostname: ${{ vars.BUNNY_STOR_HOSTNAME }}
          bunny-stor-username: ${{ secrets.BUNNY_STOR_USERNAME }}
          bunny-stor-password: ${{ secrets.BUNNY_STOR_PASSWORD }}
          fw-version: ${{ needs.getvars.outputs.version }}
          release-channel: ${{ needs.getvars.outputs.release-channel }}
          boards: ${{ needs.getvars.outputs.board-list }}

      # Advance the channel version pointers now that everything is uploaded.
      - uses: ./.github/actions/cdn-bump-version
        with:
          bunny-stor-hostname: ${{ vars.BUNNY_STOR_HOSTNAME }}
          bunny-stor-username: ${{ secrets.BUNNY_STOR_USERNAME }}
          bunny-stor-password: ${{ secrets.BUNNY_STOR_PASSWORD }}
          bunny-api-key: ${{ secrets.BUNNY_APIKEY }}
          bunny-cdn-url: ${{ vars.BUNNY_CDN_URL }}
          version: ${{ needs.getvars.outputs.version }}
          release-channel: ${{ needs.getvars.outputs.release-channel }}

  release:
    runs-on: ubuntu-latest
    needs: [getvars, cdn-deploy]
    timeout-minutes: 1
    if: (needs.getvars.outputs.release-channel == 'stable' || needs.getvars.outputs.release-channel == 'beta')
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1

      - name: Display artifacts
        run: ls -R

      # release.yml (the bot) already staged the draft release for this tag with
      # the title and notes. All we do here is attach the freshly built binaries
      # to that existing draft. `gh release upload` only adds assets: it does not
      # touch the release's draft/prerelease state, so the release stays staged
      # until a maintainer publishes it manually.
      - name: Upload binaries to staged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          shopt -s globstar nullglob
          files=(**/OpenShock_*.bin)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware binaries found to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber
