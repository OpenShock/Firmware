# When the firmware is compiled. A full 13-board build is too heavy to run per commit, so:
#   - release tags (beta rc / stable) build every board and publish to prod;
#   - develop, beta and master build every board nightly (nightly.yml dispatches one run per branch,
#     which keeps each branch's status badge current), only when firmware sources changed since
#     that branch's last nightly; develop's nightly also publishes to prod, beta and master only build;
#   - a pull request builds one canary board, or every board once it carries the ci:full-build label;
#   - a dispatch builds every board on demand.
# Branch pushes do not build at all; the cheap per-commit checks live in checks.yml.
# Fork pull requests run only after a maintainer approves them: the repository requires approval
# for every workflow run from an external contributor.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
  pull_request:
    branches:
      - master
      - beta
      - develop
    # labeled so that adding ci:full-build upgrades the PR's build; the gate ignores every other label.
    types: [opened, reopened, synchronize, labeled]
  workflow_dispatch:
    inputs:
      server:
        description: 'Repository server to publish to (prod is honoured only when running against a tag)'
        required: false
        type: choice
        default: dev
        options: [dev, prod]
      channel:
        description: 'Channel to publish onto'
        required: false
        type: choice
        default: develop
        options: [develop, beta, stable]
      nightly:
        description: 'Run as the nightly build of this branch (set by nightly.yml): skip when no firmware sources changed; server and channel are ignored'
        required: false
        type: boolean
        default: false

name: ci-build

# Per-ref.
# No cross-ref group is needed: the only state two runs could contend for is a release on the server, which refuses a second staging of a version.
# Labelling a PR with anything but ci:full-build gets its own group, so the no-op run it triggers
# does not cancel the build already running for that PR.
concurrency:
  group: >-
    ${{ github.workflow }}-${{ github.ref }}${{
    github.event.action == 'labeled' && github.event.label.name != 'ci:full-build'
    && format('-label-{0}', github.event.label.name) || '' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default; jobs needing more opt up explicitly.
# No job holds a storage or CDN credential, because no job writes to either.
permissions:
  contents: read

env:
  PYTHON_VERSION: 3.13

jobs:
  # build governs the build matrix.
  # deploy additionally cuts a GitHub release, and implies build.
  # publish governs whether the build reaches a repository server at all, and server names which one.
  # Building is not publishing: a branch push and a pull request compile and go no further.
  gate:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      deploy: ${{ steps.decide.outputs.deploy }}
      publish: ${{ steps.decide.outputs.publish }}
      server: ${{ steps.decide.outputs.server }}
      boards: ${{ steps.decide.outputs.boards }}
    steps:
      # github-script so the gate needs no checkout or install.
      - name: Decide build, deploy and publish
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { eventName, ref, sha } = context;
            const { owner, repo } = context.repo;

            const branch = ref.startsWith('refs/heads/') ? ref.slice('refs/heads/'.length) : '';
            const nightly = eventName === 'workflow_dispatch' && String(context.payload.inputs?.nightly) === 'true';

            // HEAD of this branch's last successful nightly or manual run.
            // 'schedule' covers the develop nightlies from before nightly.yml dispatched them.
            // Returns '' on error so a hiccup rebuilds rather than wrongly skipping.
            async function lastBuildSha() {
              const latestRunFor = async (event) => {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: 'ci-build.yml',
                  event,
                  branch,
                  status: 'success',
                  per_page: 1,
                });
                return data.workflow_runs[0];
              };
              try {
                const runs = (
                  await Promise.all([latestRunFor('schedule'), latestRunFor('workflow_dispatch')])
                ).filter(Boolean);
                if (runs.length === 0) return '';
                runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                return runs[0].head_sha ?? '';
              } catch (err) {
                core.warning(`Could not read the last ${branch} build: ${err.message}`);
                return '';
              }
            }

            // Paths that cannot change a firmware image or its build. The nightly skips when nothing else changed.
            // .changes/ and .github/ count as source: change files set the version, and a CI change should
            // meet a nightly before it meets a release tag.
            const NON_SOURCE = [
              /^(?!\.changes\/).*\.md$/,
              /^docs\//,
              /^LICENSE$/,
              /(^|\/)\.gitkeep$/,
              /^\.claude\//,
              /^\.github\/ISSUE_TEMPLATE\//,
              /^\.github\/dependabot\.yml$/,
              // Dev-only schema submodule and its codegen helpers; builds use the generated sources.
              /^schemas(\/|$)/,
              /^scripts\/(fetch_flatc\.py|generate_schemas\.py|flatc|flatc\.exe)$/,
            ];

            // Whether anything between base and sha can change the firmware.
            // Errs towards true: an unreadable or truncated comparison builds rather than skips.
            async function sourceChangedSince(base) {
              try {
                const { data } = await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: `${base}...${sha}`,
                  per_page: 300,
                });
                const files = data.files ?? [];
                if (files.length >= 300) return true;
                const source = files
                  .flatMap((f) => [f.filename, f.previous_filename].filter(Boolean))
                  .filter((name) => !NON_SOURCE.some((re) => re.test(name)));
                if (source.length > 0) core.info(`Firmware sources changed: ${source.slice(0, 20).join(', ')}`);
                return source.length > 0;
              } catch (err) {
                core.warning(`Could not compare ${base}...${sha}: ${err.message}`);
                return true;
              }
            }

            const FULL_BUILD_LABEL = 'ci:full-build';
            const CANARY_BOARD = 'OpenShock-Core-V2';

            let build = false;
            let deploy = false;
            // Empty builds every board.
            let boards = '';

            switch (eventName) {
              case 'pull_request': {
                const pr = context.payload.pull_request;
                const action = context.payload.action;
                if (action === 'labeled' && context.payload.label?.name !== FULL_BUILD_LABEL) {
                  core.notice(`Label "${context.payload.label?.name}" does not affect the build.`);
                  break;
                }
                build = true;
                const full = (pr.labels ?? []).some((l) => l.name === FULL_BUILD_LABEL);
                if (!full) {
                  boards = CANARY_BOARD;
                  core.notice(`Canary build of ${CANARY_BOARD} only; add the ${FULL_BUILD_LABEL} label to build every board.`);
                }
                break;
              }
              case 'push':
                // Only release tags trigger a push run.
                build = true;
                deploy = true;
                break;
              case 'workflow_dispatch':
                if (nightly) {
                  if (!['develop', 'beta', 'master'].includes(branch)) {
                    core.warning(`Nightly requested on ${ref}; only develop, beta and master have nightlies.`);
                    break;
                  }
                  const base = await lastBuildSha();
                  if (base === sha) {
                    core.notice(`${branch} unchanged since its last build (${sha}); nothing to build.`);
                    break;
                  }
                  if (base !== '' && !(await sourceChangedSince(base))) {
                    core.notice(`No firmware sources changed on ${branch} since its last build (${base}); nothing to build.`);
                    break;
                  }
                  build = true;
                  // Only develop's nightly is a release; beta and master publish from tags.
                  deploy = branch === 'develop';
                  break;
                }
                build = true;
                if (ref === 'refs/heads/develop') deploy = true;
                break;
              default:
                build = true;
            }

            // Publishing is never a side effect of a build.
            // A branch push and a pull request compile and stop, so merging changes nothing on any server until someone says to.
            // The develop nightly and a release tag publish to prod, because both are already the deliberate act.
            // The beta and master nightlies only build: those channels are published from tags.
            // Everything else reaches a server only by being dispatched, which is where the channel and the ref are chosen by hand.
            const isTag = ref.startsWith('refs/tags/');

            let publish = false;
            let server = 'dev';

            if (nightly) {
              publish = build && branch === 'develop';
              server = 'prod';
            } else if (eventName === 'workflow_dispatch') {
              publish = true;
              server = context.payload.inputs?.server === 'prod' ? 'prod' : 'dev';
              // The ref picker offers tags as well as branches, so reaching prod by hand still means running against the tag being released.
              if (server === 'prod' && !isTag) {
                core.warning(`prod was requested on ${ref}; only a tag may dispatch to prod, publishing to dev instead.`);
                server = 'dev';
              }
            } else if (eventName === 'push' && isTag) {
              publish = true;
              server = 'prod';
            }

            core.setOutput('build', build);
            core.setOutput('deploy', deploy);
            core.setOutput('publish', publish);
            core.setOutput('server', server);
            core.setOutput('boards', boards);
            core.info(`decision: build=${build} deploy=${deploy} publish=${publish} server=${server} boards=${boards || 'all'}`);

  getvars:
    needs: [gate]
    if: ${{ needs.gate.outputs.build == 'true' || needs.gate.outputs.deploy == 'true' }}
    uses: ./.github/workflows/get-vars.yml
    # Set only on a manual dispatch; empty otherwise, nightlies included, so get-vars derives the channel from the ref.
    with:
      channel: ${{ !inputs.nightly && inputs.channel || '' }}
      boards: ${{ needs.gate.outputs.boards }}

  # Opens the release the moment get-vars has settled what this run is, before anything is built.
  # Everything the server checks at init - semver, the channel enum, a version already published, another run holding the same one, an unknown board - answers here in a minute rather than after the matrix.
  # It also reserves the version: a second run for it is refused now, instead of after both have spent half an hour building.
  stage:
    name: Stage release on ${{ needs.gate.outputs.server }}
    runs-on: ubuntu-latest
    needs: [gate, getvars]
    timeout-minutes: 10
    # A fork PR cannot mint an OIDC token here, so it would fail on something the contributor cannot fix.
    if: ${{ needs.gate.outputs.publish == 'true' && github.event.pull_request.head.repo.fork != true }}
    # The environment carries OPENSHOCK_REPO_SERVER_URL, so which instance is published to is settings rather than workflow logic.
    # The required reviewer on repo-server-prod also takes effect here rather than at the publish, so a production release is approved before it spends the build rather than after.
    environment: repo-server-${{ needs.gate.outputs.server }}
    permissions:
      contents: read
      id-token: write
    outputs:
      release-id: ${{ steps.stage.outputs.release-id }}
      # The publish and abort jobs run outside the environment, so they cannot read its vars themselves.
      # This is a hostname, not a credential.
      server-url: ${{ steps.resolve.outputs.server-url }}

    steps:
      - name: Resolve server configuration
        id: resolve
        env:
          SERVER_URL: ${{ vars.OPENSHOCK_REPO_SERVER_URL }}
          TARGET: ${{ needs.gate.outputs.server }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_URL" ]; then
            echo "::error::OPENSHOCK_REPO_SERVER_URL is unset on environment repo-server-$TARGET, so this build has nowhere to publish to."
            exit 1
          fi
          echo "server-url=$SERVER_URL" >> "$GITHUB_OUTPUT"
          echo "Publishing to the $TARGET repository server."

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            CHANGELOG.md

      # Same pinned set the repo-server actions install, so this runs before a credential is minted rather than after.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .github/scripts/.python-version
          cache: 'pip'
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install script dependencies
        shell: bash
        run: pip install --require-hashes -r .github/scripts/requirements.txt

      # Refuses the run if this repository's rules say it may not publish what get-vars resolved.
      # The rules are all about prod, and all about things the server cannot know: that a stable release descends from master, that a maintainer staged a draft for it.
      - name: Apply repository publishing policy
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          SERVER: ${{ needs.gate.outputs.server }}
          CHANNEL: ${{ needs.getvars.outputs.release-channel }}
          VERSION: ${{ needs.getvars.outputs.version }}
        run: python .github/scripts/repo_server_policy.py

      - uses: ./.github/actions/repo-server-token
        id: token

      - uses: ./.github/actions/repo-server-publish
        id: stage
        with:
          server-url: ${{ steps.resolve.outputs.server-url }}
          token: ${{ steps.token.outputs.token }}
          version: ${{ needs.getvars.outputs.version }}
          channel: ${{ needs.getvars.outputs.release-channel }}
          boards: ${{ needs.getvars.outputs.board-list }}
          mode: init

  build-frontend:
    # Waits on stage so the reviewer on a prod release approves before the compute is spent rather than while it burns.
    # stage is skipped on anything that does not publish, and a skip is not a failure, so a PR still builds.
    needs: [gate, stage]
    if: >-
      ${{ !cancelled()
      && needs.gate.outputs.build == 'true'
      && needs.stage.result != 'failure' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          sparse-checkout: |
            .github
            frontend

      - uses: ./.github/actions/build-frontend

  # Pack the captive-portal assets into the static0 image once (board-independent).
  # Runs in parallel with the per-board C++ build below; merge-partitions links them.
  build-staticfs:
    runs-on: ubuntu-latest
    needs: [getvars, build-frontend]
    # `stage` is skipped on every run that does not publish, and GitHub propagates that
    # skip down the needs graph to any job that does not override it. build-frontend and
    # build-firmware each carry their own condition, so they run; this job did not, so it
    # skipped on pull requests - taking merge-partitions and checkpoint-build with it, and
    # leaving a PR with no flashable images. It builds on dispatch, which is why it went
    # unnoticed.
    if: >-
      ${{ !cancelled()
      && needs.getvars.result == 'success'
      && needs.build-frontend.result == 'success' }}
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/build-staticfs
        with:
          version: ${{ needs.getvars.outputs.version }}

  # Populate the ESP-IDF cache once, before the matrix fans out.
  #
  # setup-esp-idf only runs the installer when the cache misses, so on a warm key every
  # board skips it. The problem is the cold key: without this job all 13 boards miss at
  # the same moment and all 13 run the installer concurrently, which measured 867s per job
  # - some 700s of it apt fetching cmake at ~35 KB/s while twelve siblings did the same.
  # One job paying that once, and thirteen then hitting a warm cache, is strictly cheaper.
  #
  # A lookup-only probe first, so the usual case - the cache already exists - costs a few
  # seconds and does not download the entry just to prove it is there.
  warm-esp-idf:
    name: Warm the ESP-IDF cache
    runs-on: ubuntu-latest
    needs: [gate]
    if: ${{ !cancelled() && needs.gate.outputs.build == 'true' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github

      # lookup-only so the cache key lives in exactly one place, inside the action. The
      # probe checks for the entry without downloading it, so the usual case - already
      # populated - costs seconds; on a miss the action installs, prunes and saves.
      - uses: ./.github/actions/setup-esp-idf
        with:
          lookup-only: 'true'

  # Compile each board's C++ firmware.
  # Builds only the code partitions (no static0 image, no frontend), so it runs in parallel with build-staticfs.
  build-firmware:
    # The matrix carries chip and cache-group alongside the board, which would otherwise
    # all end up in the generated job name.
    name: build-firmware (${{ matrix.board }})
    runs-on: ubuntu-latest
    needs: [gate, getvars, stage, warm-esp-idf]
    # getvars is named explicitly: without it, !cancelled() would let the matrix start on an empty board-matrix when get-vars failed.
    if: >-
      ${{ !cancelled()
      && needs.gate.outputs.build == 'true'
      && needs.getvars.result == 'success'
      && needs.stage.result != 'failure'
      && needs.warm-esp-idf.result == 'success' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.getvars.outputs.board-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # flatbuffers runtime lives in a submodule (components/flatbuffers).
          submodules: recursive

      - uses: ./.github/actions/build-firmware
        with:
          board: ${{ matrix.board }}
          version: ${{ needs.getvars.outputs.version }}
          cache-group: ${{ matrix.cache-group }}
          idf-cache-writer: ${{ matrix.idf-cache-writer }}

  # Link every board's C++ partitions with the shared static0 image into one flashable binary each.
  # Waits on both parallel build legs.
  # One job rather than a matrix: the merge is seconds of esptool per board, so thirteen runners spent more on checkout, pip and artifact downloads than on the work.
  merge-partitions:
    runs-on: ubuntu-latest
    needs: [getvars, build-staticfs, build-firmware]
    # Explicit for the same reason as build-staticfs above: this job sits downstream of
    # the same chain, so it must not inherit a skip from it.
    if: >-
      ${{ !cancelled()
      && needs.getvars.result == 'success'
      && needs.build-staticfs.result == 'success'
      && needs.build-firmware.result == 'success' }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
            boards

      - uses: ./.github/actions/merge-partitions
        with:
          version: ${{ needs.getvars.outputs.version }}
          boards: ${{ needs.getvars.outputs.board-list }}

  checkpoint-build:
    runs-on: ubuntu-slim
    needs: [merge-partitions]
    timeout-minutes: 1
    steps:
      - run: echo "Builds checkpoint reached"

  # Upload every board's artifacts with the hash CI computed for each, into the release stage opened, then publish.
  # Fail on the first non-success; that is the whole contract.
  # Where artifacts are stored and which hostname serves them are the server's decisions, and CI holds no storage credential to second-guess them with.
  #
  # Every build publishes, against the development instance.
  # Publishing consumes a version and only a maintainer can undo it, at /admin/firmware/releases.
  # Branch builds carry +<short-sha> so pushes do not collide; re-running a build on a published commit does.
  # No environment here: the reviewer already approved this release at stage, and nothing can be promoted that was not staged there.
  repo-server:
    name: Repository server (publish to ${{ needs.gate.outputs.server }})
    runs-on: ubuntu-latest
    needs: [gate, getvars, stage, checkpoint-build]
    timeout-minutes: 20
    if: ${{ needs.gate.outputs.publish == 'true' && github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            CHANGELOG.md

      # Same pinned set the repo-server actions install, so this runs before a credential is minted rather than after.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .github/scripts/.python-version
          cache: 'pip'
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install script dependencies
        shell: bash
        run: pip install --require-hashes -r .github/scripts/requirements.txt

      - uses: ./.github/actions/repo-server-token
        id: token

      - uses: ./.github/actions/repo-server-publish
        with:
          server-url: ${{ needs.stage.outputs.server-url }}
          token: ${{ steps.token.outputs.token }}
          release-id: ${{ needs.stage.outputs.release-id }}
          boards: ${{ needs.getvars.outputs.board-list }}
          mode: publish

  # The finally for the release stage opened.
  # That lifetime now spans jobs, so nothing inside a single script can close it: if the build fails, is cancelled, or never reaches the publish, this is what hands the version back.
  # The server's TTL sweeper is the backstop rather than the mechanism - waiting for it would hold the version against the very retry meant to fix the failure.
  abort:
    name: Abort staged release
    runs-on: ubuntu-latest
    needs: [gate, stage, repo-server]
    timeout-minutes: 10
    if: ${{ always() && needs.stage.outputs.release-id != '' && needs.repo-server.result != 'success' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: .github

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .github/scripts/.python-version
          cache: 'pip'
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install script dependencies
        shell: bash
        run: pip install --require-hashes -r .github/scripts/requirements.txt

      - uses: ./.github/actions/repo-server-token
        id: token

      - uses: ./.github/actions/repo-server-publish
        with:
          server-url: ${{ needs.stage.outputs.server-url }}
          token: ${{ steps.token.outputs.token }}
          release-id: ${{ needs.stage.outputs.release-id }}
          mode: abort

  # Mirrors the binaries onto the GitHub release, for people rather than devices.
  # Runs after the publish, with no always() guard, so a release never advertises what no device can fetch.
  # Stays on the deploy gate: every build publishes, not every build cuts a release.
  release:
    runs-on: ubuntu-latest
    needs: [gate, getvars, repo-server]
    timeout-minutes: 5
    # A GitHub release exists only for a tag, and only because release.yml staged the draft.
    # Testing the ref rather than the channel, since a dispatch may now name a channel the ref has no release for.
    if: >-
      needs.gate.outputs.deploy == 'true'
      && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      # Only the merged, flashable binaries are needed here; downloading every artifact (frontend, per-board partitions, staticfs) just to glob for the merged images is wasteful.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          name: firmware_merged

      - name: Display artifacts
        run: ls -R

      # release.yml staged the draft release for this tag with the title and notes.
      # Here we attach the freshly built binaries and then publish the draft - so the GitHub release goes live only once its binaries exist and the repository server is already serving the version.
      - name: Upload binaries to staged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          shopt -s globstar nullglob
          files=(**/OpenShock_*.bin)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware binaries found to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      # Solidify: the version is live on the repository server and the binaries are attached - now publish the draft, and only then announce.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: gh release edit "$TAG" --draft=false

  # Announce the release to the OpenShock API last of all - after the repository server has published it, so the API never leads the rollout (a device asked to update by the API could otherwise be pointed at a version the server is not yet serving).
  # Chaining on `release` inherits its conditions: only a stable/beta deploy gets this far, which is also the only case that produced a release.json to send.
  announce:
    runs-on: ubuntu-slim # lightweight: gh + curl only
    needs: [getvars, release]
    timeout-minutes: 5
    if: ${{ vars.OPENSHOCK_API_URL != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      # release.json was staged as a release asset by release.yml.
      - name: Announce release to OpenShock API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          API_URL: ${{ vars.OPENSHOCK_API_URL }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern release.json --dir .
          OIDC_TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openshock-release-ingest" \
            | jq -r .value)
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Failed to fetch GitHub OIDC token"
            exit 1
          fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$API_URL/1/public/releases" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @release.json
