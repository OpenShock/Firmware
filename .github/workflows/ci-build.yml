on:
  # develop, beta and master all build on every push (paths-ignore skips
  # docs/meta-only changes). develop also keeps a nightly schedule. Release
  # tags always build.
  push:
    branches:
      - develop
      - beta
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
    # paths-ignore applies to branch pushes only; GitHub does not evaluate it
    # for tag pushes, so release tags always build. A develop push is skipped
    # only when EVERY changed file matches one of these (docs, tooling, tests).
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/.gitkeep'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      # schemas is a dev-only submodule used to regenerate committed code via the
      # scripts/ tooling below; no CI build checks it out, so a pointer bump alone
      # changes nothing. Regenerated output is committed elsewhere and still builds.
      - 'schemas'
      - 'schemas/**'
      - 'scripts/fetch_flatc.py'
      - 'scripts/generate_schemas.py'
      - 'scripts/flatc'
      - 'scripts/flatc.exe'
  pull_request:
    branches:
      - master
      - beta
      - develop
    types: [opened, reopened, synchronize]
  workflow_dispatch: # Manually invoked, e.g. to force a develop build.
  schedule:
    - cron: '0 3 * * *' # Nightly develop build; the gate job skips it if idle.

name: ci-build

# Per-ref: different branches (and tags) build and deploy concurrently. A PR
# cancels its own superseded runs; branch/tag runs queue per ref. Nothing here
# needs a group shared across refs: the only state two runs could contend for is
# a release on the repository server, and the server owns that - a version can be
# staged once, and a second attempt at it is refused with ReleaseAlreadyStaging
# rather than interleaved.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default for every job. Jobs that need more (actions:read on the
# gate, id-token:write on repo-server/announce, contents:write on release) opt up
# explicitly. Note what is absent: no job holds a storage or CDN credential,
# because no job writes to storage or a CDN.
permissions:
  contents: read

env:
  PYTHON_VERSION: 3.13

jobs:
  # Decides what this run does:
  #   build  - run the build matrix (any branch push, PRs, release tags)
  #   deploy - publish to the repository server for real, instead of the dry run
  #            every other build does (release tags; nightly/manual develop deploy)
  # develop/beta/master pushes build but do not deploy. schedule (develop) and a
  # manual dispatch on develop rebuild and deploy; the nightly is skipped when
  # develop has not advanced since the last one. deploy always implies build.
  gate:
    runs-on: ubuntu-slim # lightweight: one github-script step, no checkout/install
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      # Decide what this run does. Inlined as github-script (which preloads
      # octokit + core) so the gate needs no checkout, no pnpm install and no
      # node_modules on the critical path of every push/PR.
      #   push (branch)     -> build; push (tag) -> build + deploy
      #   pull_request      -> build
      #   schedule          -> rebuild + deploy develop, only when it advanced
      #                        since the last develop deploy
      #   workflow_dispatch -> build; also deploy when run on develop
      # deploy always implies build.
      - name: Decide build vs deploy
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { eventName, ref, sha } = context;
            const { owner, repo } = context.repo;

            // HEAD deployed by the most recent develop deploy - a nightly
            // (schedule) or a manual dispatch of develop - or '' (also on API
            // error, so a transient hiccup degrades to "treat as changed" and
            // deploys rather than wrongly skipping). Both event types are
            // considered so a manual deploy is not invisible to the next nightly.
            async function lastDeploySha() {
              const latestRunFor = async (event) => {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: 'ci-build.yml',
                  event,
                  branch: 'develop',
                  status: 'success',
                  per_page: 1,
                });
                return data.workflow_runs[0];
              };
              try {
                const runs = (
                  await Promise.all([latestRunFor('schedule'), latestRunFor('workflow_dispatch')])
                ).filter(Boolean);
                if (runs.length === 0) return '';
                runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                return runs[0].head_sha ?? '';
              } catch (err) {
                core.warning(`Could not read the last develop deploy: ${err.message}`);
                return '';
              }
            }

            let build = false;
            let deploy = false;

            switch (eventName) {
              case 'pull_request':
                build = true;
                break;
              case 'push':
                build = true;
                if (ref.startsWith('refs/tags/')) deploy = true;
                break;
              case 'schedule':
                if (sha !== (await lastDeploySha())) {
                  build = true;
                  deploy = true;
                } else {
                  core.notice(`develop unchanged since last deploy (${sha}); nothing to deploy.`);
                }
                break;
              case 'workflow_dispatch':
                build = true;
                if (ref === 'refs/heads/develop') deploy = true;
                break;
              default:
                build = true;
            }

            core.setOutput('build', build);
            core.setOutput('deploy', deploy);
            core.info(`decision: build=${build} deploy=${deploy}`);

  getvars:
    needs: [gate]
    if: ${{ needs.gate.outputs.build == 'true' || needs.gate.outputs.deploy == 'true' }}
    uses: ./.github/workflows/get-vars.yml

  build-frontend:
    needs: [gate]
    if: ${{ needs.gate.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          sparse-checkout: |
            .github
            frontend

      - uses: ./.github/actions/build-frontend

  # Pack the captive-portal assets into the static0 image once (board-independent).
  # Runs in parallel with the per-board C++ build below; merge-partitions links them.
  build-staticfs:
    runs-on: ubuntu-latest
    needs: [getvars, build-frontend]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/build-staticfs
        with:
          version: ${{ needs.getvars.outputs.version }}

  # Compile each board's C++ firmware. Builds only the code partitions (no static0
  # image, no frontend), so it runs in parallel with build-staticfs.
  build-firmware:
    runs-on: ubuntu-latest
    needs: [gate, getvars]
    if: ${{ needs.gate.outputs.build == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.getvars.outputs.board-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # flatbuffers runtime lives in a submodule (components/flatbuffers).
          submodules: recursive

      - uses: ./.github/actions/build-firmware
        with:
          board: ${{ matrix.board }}
          version: ${{ needs.getvars.outputs.version }}

  # Link each board's C++ partitions with the shared static0 image into one
  # flashable binary. Waits on both parallel build legs.
  merge-partitions:
    runs-on: ubuntu-latest
    needs: [getvars, build-staticfs, build-firmware]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.getvars.outputs.board-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
            boards

      - uses: ./.github/actions/merge-partitions
        with:
          version: ${{ needs.getvars.outputs.version }}
          board: ${{ matrix.board }}

  checkpoint-build:
    runs-on: ubuntu-slim # lightweight: barrier job, just an echo
    needs: [merge-partitions]
    timeout-minutes: 1
    steps:
      - run: echo "Builds checkpoint reached"

  # The deployment, in full. CI starts a release on the repository server, uploads every
  # board's artifacts to it, and tells it to publish - failing on the first of those that
  # does not succeed. There is nothing else, and deliberately so: where the artifacts are
  # stored, which hostname serves them and the moment a channel starts offering them are the
  # server's decisions, taken behind one API call. CI holds no storage or CDN credential, so
  # a mistake here cannot leave objects, pointer files and the release index disagreeing
  # about what is live.
  #
  # `mode` follows the deploy gate:
  #
  #   deploy == false  dry run - init, upload every board, then discard
  #   deploy == true   publish for real
  #
  # A dry run parses the same changelog, uploads the same bytes and passes the same
  # server-side hash verification as a real publish, so every ordinary build exercises the
  # publish path rather than it being first walked on release day. Either ending leaves
  # nothing staged: the action aborts the release on the dry-run path and on any failure, so
  # the next attempt can reuse the version instead of colliding with an abandoned one.
  #
  # CI submits blobs and the hash it computed for each, and fails on any non-success from the
  # server. That is the whole contract. The server hashes what it received and rejects a
  # mismatch; that the stored objects are retrievable at the URLs it advertises is its own
  # invariant, checked at publish. CI is not in a position to assert either - it does not know
  # where the server chose to write, or which hostname fronts it.
  #
  # There is no preflight for the same reason. An unregistered repository, a missing scope and
  # an unknown board are all non-success responses from init, before a single artifact is
  # uploaded, and each names its own cause. Asking the same questions beforehand only moved the
  # answer earlier by a second and gave it a second place to be wrong.
  #
  # A published version goes live on that branch's channel and CI cannot take it back; only a
  # maintainer can, at /admin/firmware/releases.
  repo-server:
    name: Repository server (${{ needs.gate.outputs.deploy == 'true' && 'publish' || 'dry run' }})
    runs-on: ubuntu-latest
    needs: [gate, getvars, checkpoint-build]
    timeout-minutes: 20
    # A fork PR cannot mint an OIDC token for this repository, so it would fail on something
    # the contributor cannot fix. An unset server URL is handled inside the job instead of
    # here: skipping a job is how a deploy silently ships nothing, and this job is the deploy.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
      id-token: write

    steps:
      # Not configured is only tolerable when nothing was going to be published anyway.
      - name: Resolve server configuration
        id: config
        env:
          SERVER_URL: ${{ vars.OPENSHOCK_REPO_SERVER_URL }}
          DEPLOY: ${{ needs.gate.outputs.deploy }}
        run: |
          set -euo pipefail
          if [ -n "$SERVER_URL" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$DEPLOY" = 'true' ]; then
            echo "::error::OPENSHOCK_REPO_SERVER_URL is unset, so this deploy has nowhere to publish to."
            exit 1
          fi
          echo "::notice::OPENSHOCK_REPO_SERVER_URL is unset; skipping the dry run."
          echo "configured=false" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: ${{ steps.config.outputs.configured == 'true' }}
        with:
          sparse-checkout: |
            .github
            CHANGELOG.md

      # A beta/master publish must have a draft release staged by release.yml for this
      # version; otherwise a stray tag push could put firmware on a channel devices follow.
      # develop has no releases, so it is exempt, and a dry run publishes nothing either way.
      - name: Require a staged draft release (beta/master publish only)
        if: >-
          steps.config.outputs.configured == 'true'
          && needs.gate.outputs.deploy == 'true'
          && needs.getvars.outputs.release-channel != 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          set -euo pipefail
          # release.yml pushes the tag (which triggers this run) and only then
          # stages the draft, so poll for up to ~60s rather than failing on the
          # brief window before the draft exists.
          for attempt in $(seq 1 12); do
            isDraft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
            if [ "$isDraft" = "true" ]; then
              echo "Draft release for $TAG is staged."
              exit 0
            fi
            echo "Draft for $TAG not staged yet (state: $isDraft); retry $attempt/12..."
            sleep 5
          done
          echo "::error::No draft release for $TAG after ~60s. release.yml must stage the draft before the publish runs."
          exit 1

      - uses: ./.github/actions/repo-server-token
        id: token
        if: ${{ steps.config.outputs.configured == 'true' }}

      # get-vars derives the channel from the branch name, so a feature branch yields something
      # the server's enum does not know. Only the three real channels pass through; anything
      # else is treated as develop.
      - name: Resolve channel
        id: channel
        if: ${{ steps.config.outputs.configured == 'true' }}
        env:
          CHANNEL: ${{ needs.getvars.outputs.release-channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable|beta|develop) name="$CHANNEL" ;;
            *) name='develop' ;;
          esac
          echo "Channel: $CHANNEL -> $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/repo-server-publish
        if: ${{ steps.config.outputs.configured == 'true' }}
        with:
          server-url: ${{ vars.OPENSHOCK_REPO_SERVER_URL }}
          token: ${{ steps.token.outputs.token }}
          version: ${{ needs.getvars.outputs.version }}
          channel: ${{ steps.channel.outputs.name }}
          boards: ${{ needs.getvars.outputs.board-list }}
          mode: ${{ needs.gate.outputs.deploy == 'true' && 'publish' || 'dry-run' }}

  # Mirrors the binaries onto the GitHub release, for people rather than for devices - a hub
  # updates from the repository server and never looks here. It runs after the publish
  # because the version is live at that point, so a published GitHub release cannot advertise
  # something no device can fetch. `needs: repo-server` without an always() guard is what
  # makes that ordering strict: a failed or discarded publish skips this job.
  #
  # Only a real deploy of a stable/beta tag has a draft staged by release.yml; a develop
  # deploy has no release, and an ordinary build only did a dry run.
  release:
    runs-on: ubuntu-latest
    needs: [gate, getvars, repo-server]
    timeout-minutes: 5
    if: >-
      needs.gate.outputs.deploy == 'true'
      && (needs.getvars.outputs.release-channel == 'stable' || needs.getvars.outputs.release-channel == 'beta')
    permissions:
      contents: write

    steps:
      # Only the merged, flashable binaries are needed here; downloading every
      # artifact (frontend, per-board partitions, staticfs) just to glob for the
      # merged images is wasteful.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: firmware_merged_*

      - name: Display artifacts
        run: ls -R

      # release.yml staged the draft release for this tag with the title and
      # notes. Here we attach the freshly built binaries and then publish the
      # draft - so the GitHub release goes live only once its binaries exist and
      # the repository server is already serving the version.
      - name: Upload binaries to staged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          shopt -s globstar nullglob
          files=(**/OpenShock_*.bin)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware binaries found to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      # Solidify: the version is live on the repository server and the binaries
      # are attached - now publish the draft, and only then announce.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: gh release edit "$TAG" --draft=false

  # Announce the release to the OpenShock API last of all - after the repository server has
  # published it, so the API never leads the rollout (a device asked to update by the API
  # could otherwise be pointed at a version the server is not yet serving). Chaining on
  # `release` inherits its conditions: only a stable/beta deploy gets this far, which is also
  # the only case that produced a release.json to send.
  announce:
    runs-on: ubuntu-slim # lightweight: gh + curl only
    needs: [getvars, release]
    timeout-minutes: 5
    if: ${{ vars.OPENSHOCK_API_URL != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      # release.json was staged as a release asset by release.yml.
      - name: Announce release to OpenShock API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          API_URL: ${{ vars.OPENSHOCK_API_URL }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern release.json --dir .
          OIDC_TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openshock-release-ingest" \
            | jq -r .value)
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Failed to fetch GitHub OIDC token"
            exit 1
          fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$API_URL/1/public/releases" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @release.json
