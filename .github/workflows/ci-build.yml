on:
  push:
    branches:
      - develop
      - beta
      - master
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+-*'
    # Branch pushes only; GitHub does not evaluate paths-ignore for tags.
    # A push is skipped only when every changed file matches.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '**/.gitkeep'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/dependabot.yml'
      # Dev-only submodule; no CI build checks it out, so a pointer bump alone changes nothing.
      - 'schemas'
      - 'schemas/**'
      - 'scripts/fetch_flatc.py'
      - 'scripts/generate_schemas.py'
      - 'scripts/flatc'
      - 'scripts/flatc.exe'
  pull_request:
    branches:
      - master
      - beta
      - develop
    types: [opened, reopened, synchronize]
  workflow_dispatch: # Manually invoked, e.g. to force a develop build.
  schedule:
    - cron: '0 3 * * *' # Nightly develop build; the gate job skips it if idle.

name: ci-build

# Per-ref.
# No cross-ref group is needed: the only state two runs could contend for is a release on the server, which refuses a second staging of a version.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least-privilege default; jobs needing more opt up explicitly.
# No job holds a storage or CDN credential, because no job writes to either.
permissions:
  contents: read

env:
  PYTHON_VERSION: 3.13

jobs:
  # build governs the build matrix, and every build publishes to the repository server.
  # deploy additionally cuts a GitHub release, and implies build.
  gate:
    runs-on: ubuntu-slim
    timeout-minutes: 3
    permissions:
      contents: read
      actions: read
    outputs:
      build: ${{ steps.decide.outputs.build }}
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      # github-script so the gate needs no checkout or install.
      - name: Decide build vs deploy
        id: decide
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        with:
          script: |
            const { eventName, ref, sha } = context;
            const { owner, repo } = context.repo;

            // HEAD of the last develop deploy, nightly or manual.
            // Returns '' on error so a hiccup redeploys rather than wrongly skipping.
            async function lastDeploySha() {
              const latestRunFor = async (event) => {
                const { data } = await github.rest.actions.listWorkflowRuns({
                  owner,
                  repo,
                  workflow_id: 'ci-build.yml',
                  event,
                  branch: 'develop',
                  status: 'success',
                  per_page: 1,
                });
                return data.workflow_runs[0];
              };
              try {
                const runs = (
                  await Promise.all([latestRunFor('schedule'), latestRunFor('workflow_dispatch')])
                ).filter(Boolean);
                if (runs.length === 0) return '';
                runs.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
                return runs[0].head_sha ?? '';
              } catch (err) {
                core.warning(`Could not read the last develop deploy: ${err.message}`);
                return '';
              }
            }

            let build = false;
            let deploy = false;

            switch (eventName) {
              case 'pull_request':
                build = true;
                break;
              case 'push':
                build = true;
                if (ref.startsWith('refs/tags/')) deploy = true;
                break;
              case 'schedule':
                if (sha !== (await lastDeploySha())) {
                  build = true;
                  deploy = true;
                } else {
                  core.notice(`develop unchanged since last deploy (${sha}); nothing to deploy.`);
                }
                break;
              case 'workflow_dispatch':
                build = true;
                if (ref === 'refs/heads/develop') deploy = true;
                break;
              default:
                build = true;
            }

            core.setOutput('build', build);
            core.setOutput('deploy', deploy);
            core.info(`decision: build=${build} deploy=${deploy}`);

  getvars:
    needs: [gate]
    if: ${{ needs.gate.outputs.build == 'true' || needs.gate.outputs.deploy == 'true' }}
    uses: ./.github/workflows/get-vars.yml

  build-frontend:
    needs: [gate]
    if: ${{ needs.gate.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive
          sparse-checkout: |
            .github
            frontend

      - uses: ./.github/actions/build-frontend

  # Pack the captive-portal assets into the static0 image once (board-independent).
  # Runs in parallel with the per-board C++ build below; merge-partitions links them.
  build-staticfs:
    runs-on: ubuntu-latest
    needs: [getvars, build-frontend]
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: ./.github/actions/build-staticfs
        with:
          version: ${{ needs.getvars.outputs.version }}

  # Compile each board's C++ firmware.
  # Builds only the code partitions (no static0 image, no frontend), so it runs in parallel with build-staticfs.
  build-firmware:
    runs-on: ubuntu-latest
    needs: [gate, getvars]
    if: ${{ needs.gate.outputs.build == 'true' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.getvars.outputs.board-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # flatbuffers runtime lives in a submodule (components/flatbuffers).
          submodules: recursive

      - uses: ./.github/actions/build-firmware
        with:
          board: ${{ matrix.board }}
          version: ${{ needs.getvars.outputs.version }}

  # Link each board's C++ partitions with the shared static0 image into one flashable binary.
  # Waits on both parallel build legs.
  merge-partitions:
    runs-on: ubuntu-latest
    needs: [getvars, build-staticfs, build-firmware]
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.getvars.outputs.board-matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            scripts
            boards

      - uses: ./.github/actions/merge-partitions
        with:
          version: ${{ needs.getvars.outputs.version }}
          board: ${{ matrix.board }}

  checkpoint-build:
    runs-on: ubuntu-slim
    needs: [merge-partitions]
    timeout-minutes: 1
    steps:
      - run: echo "Builds checkpoint reached"

  # Stage a release on the repository server, upload every board's artifacts with the hash CI computed for each, publish.
  # Fail on the first non-success; that is the whole contract.
  # Where artifacts are stored and which hostname serves them are the server's decisions, and CI holds no storage credential to second-guess them with.
  #
  # Every build publishes, against the development instance.
  # Publishing consumes a version and only a maintainer can undo it, at /admin/firmware/releases.
  # Branch builds carry +<short-sha> so pushes do not collide; re-running a build on a published commit does.
  # A staged release is aborted on failure, so the retry can reuse the version.
  repo-server:
    name: Repository server (publish)
    runs-on: ubuntu-latest
    needs: [gate, getvars, checkpoint-build]
    timeout-minutes: 20
    # A fork PR cannot mint an OIDC token here, so it would fail on something the contributor cannot fix.
    if: ${{ github.event.pull_request.head.repo.fork != true }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Resolve server configuration
        env:
          SERVER_URL: ${{ vars.OPENSHOCK_REPO_SERVER_URL }}
        run: |
          set -euo pipefail
          if [ -z "$SERVER_URL" ]; then
            echo "::error::OPENSHOCK_REPO_SERVER_URL is unset, so this build has nowhere to publish to."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            CHANGELOG.md

      # get-vars maps a push to `master` or `beta` onto a channel devices follow, tag or no tag.
      # release.yml's draft is what stops a stray push from shipping there.
      - name: Require a staged draft release (beta/stable publish only)
        if: >-
          needs.getvars.outputs.release-channel != 'develop'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          set -euo pipefail
          # release.yml pushes the tag (which triggers this run) and only then stages the draft, so poll for up to ~60s rather than failing on the brief window before the draft exists.
          for attempt in $(seq 1 12); do
            isDraft=$(gh release view "$TAG" --repo "$REPO" --json isDraft --jq '.isDraft' 2>/dev/null || echo "missing")
            if [ "$isDraft" = "true" ]; then
              echo "Draft release for $TAG is staged."
              exit 0
            fi
            echo "Draft for $TAG not staged yet (state: $isDraft); retry $attempt/12..."
            sleep 5
          done
          echo "::error::No draft release for $TAG after ~60s. release.yml must stage the draft before the publish runs."
          exit 1

      - uses: ./.github/actions/repo-server-token
        id: token

      # A feature branch yields a channel the server's enum does not know; treat it as develop.
      - name: Resolve channel
        id: channel
        env:
          CHANNEL: ${{ needs.getvars.outputs.release-channel }}
        run: |
          set -euo pipefail
          case "$CHANNEL" in
            stable|beta|develop) name="$CHANNEL" ;;
            *) name='develop' ;;
          esac
          echo "Channel: $CHANNEL -> $name"
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/repo-server-publish
        with:
          server-url: ${{ vars.OPENSHOCK_REPO_SERVER_URL }}
          token: ${{ steps.token.outputs.token }}
          version: ${{ needs.getvars.outputs.version }}
          channel: ${{ steps.channel.outputs.name }}
          boards: ${{ needs.getvars.outputs.board-list }}
          mode: publish

  # Mirrors the binaries onto the GitHub release, for people rather than devices.
  # Runs after the publish, with no always() guard, so a release never advertises what no device can fetch.
  # Stays on the deploy gate: every build publishes, not every build cuts a release.
  release:
    runs-on: ubuntu-latest
    needs: [gate, getvars, repo-server]
    timeout-minutes: 5
    if: >-
      needs.gate.outputs.deploy == 'true'
      && (needs.getvars.outputs.release-channel == 'stable' || needs.getvars.outputs.release-channel == 'beta')
    permissions:
      contents: write

    steps:
      # Only the merged, flashable binaries are needed here; downloading every artifact (frontend, per-board partitions, staticfs) just to glob for the merged images is wasteful.
      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          pattern: firmware_merged_*

      - name: Display artifacts
        run: ls -R

      # release.yml staged the draft release for this tag with the title and notes.
      # Here we attach the freshly built binaries and then publish the draft - so the GitHub release goes live only once its binaries exist and the repository server is already serving the version.
      - name: Upload binaries to staged release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          shopt -s globstar nullglob
          files=(**/OpenShock_*.bin)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No firmware binaries found to upload"
            exit 1
          fi
          gh release upload "$TAG" "${files[@]}" --clobber

      # Solidify: the version is live on the repository server and the binaries are attached - now publish the draft, and only then announce.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: gh release edit "$TAG" --draft=false

  # Announce the release to the OpenShock API last of all - after the repository server has published it, so the API never leads the rollout (a device asked to update by the API could otherwise be pointed at a version the server is not yet serving).
  # Chaining on `release` inherits its conditions: only a stable/beta deploy gets this far, which is also the only case that produced a release.json to send.
  announce:
    runs-on: ubuntu-slim # lightweight: gh + curl only
    needs: [getvars, release]
    timeout-minutes: 5
    if: ${{ vars.OPENSHOCK_API_URL != '' }}
    permissions:
      contents: read
      id-token: write

    steps:
      # release.json was staged as a release asset by release.yml.
      - name: Announce release to OpenShock API
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          API_URL: ${{ vars.OPENSHOCK_API_URL }}
          TAG: ${{ needs.getvars.outputs.version }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern release.json --dir .
          OIDC_TOKEN=$(curl -sLS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=openshock-release-ingest" \
            | jq -r .value)
          if [ -z "$OIDC_TOKEN" ] || [ "$OIDC_TOKEN" = "null" ]; then
            echo "::error::Failed to fetch GitHub OIDC token"
            exit 1
          fi
          curl -fsSL --retry 3 --retry-delay 5 -X POST "$API_URL/1/public/releases" \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @release.json
