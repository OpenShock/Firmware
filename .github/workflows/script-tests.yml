# Unit tests for the CI/release scripts (.github/scripts/tests) and the build helpers (scripts/tests).
name: script-tests

on:
  push:
    branches: ['**']
    paths:
      - '.github/scripts/**'
      - 'scripts/**'
      - 'partitions/**'
      - 'boards/**'
      - 'sdkconfig.defaults'
      - 'certificates/cert_bundle.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/script-tests.yml'
  # Same-repo PR branches are covered by their push run; pull_request is for forks.
  pull_request:
    paths:
      - '.github/scripts/**'
      - 'scripts/**'
      - 'partitions/**'
      - 'boards/**'
      - 'sdkconfig.defaults'
      - 'certificates/cert_bundle.py'
      - 'pyproject.toml'
      - 'requirements.txt'
      - '.python-version'
      - '.github/workflows/script-tests.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  pytest:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .python-version
          cache: 'pip'
          cache-dependency-path: |
            requirements.txt
            .github/scripts/requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r .github/scripts/requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      - name: Run tests
        run: python -m pytest
