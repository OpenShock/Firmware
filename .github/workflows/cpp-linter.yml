name: cpp-linter

on:
  pull_request:
    types: [opened, reopened, synchronize]
    paths: ['**.c', '**.h', '**.cpp', '**.hpp', '.clang-format', '.github/workflows/cpp-linter.yml']
  push:
    # Branch-scoped: path filters are ignored for tag pushes, so without this every
    # release tag would re-lint.
    branches: [develop, beta, master]
    paths: ['**.c', '**.h', '**.cpp', '**.hpp', '.clang-format', '.github/workflows/cpp-linter.yml']
  workflow_dispatch: # Manually invoked by user.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  cpp-linter:
    name: C/C++ Linter
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # clang-format only, so no ESP-IDF or compile database is needed.
      - uses: cpp-linter/cpp-linter-action@8120e05c7fbd25fa09fa93424ec49f55f7b304ab # v2.23.1
        id: linter
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          style: file
          version: 21
          # clang-tidy is off: it rejects the gcc-only flags of the ESP-IDF compile DB. CodeQL covers static analysis.
          tidy-checks: '-*'
          # Scan the tree, not the PR diff: GitHub returns 406 for very large diffs.
          files-changed-only: false
          ignore: '.github|build|managed_components|components/littlefs|components/flatbuffers|components/serialization/include/serialization/_fbs'
          # Commit comments on push need contents:write, which this job does not grant.
          thread-comments: ${{ github.event_name == 'pull_request' && 'update' || 'false' }}

      - name: Fail on lint errors
        if: steps.linter.outputs.checks-failed > 0
        run: |
          echo "::error::Some files failed the linting checks!"
          exit 1
