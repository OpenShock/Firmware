# Starts the nightly firmware build on each long-lived branch.
# A schedule only ever runs on the default branch, and a branch's status badge only reflects runs
# on that branch, so this dispatches ci-build once per branch instead of building here. ci-build's
# gate skips a branch whose firmware sources have not changed since its last build, and decides
# what each nightly publishes (develop to prod; beta and master build only).
on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

name: nightly

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-slim
    timeout-minutes: 5
    permissions:
      # Dispatching a workflow is the one event GITHUB_TOKEN may trigger.
      actions: write
    strategy:
      fail-fast: false
      matrix:
        branch: [develop, beta, master]
    steps:
      # The branch's own ci-build.yml runs, so it must already define the nightly input.
      - name: Dispatch ci-build on ${{ matrix.branch }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3  # v9.0.0
        env:
          BRANCH: ${{ matrix.branch }}
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci-build.yml',
              ref: process.env.BRANCH,
              inputs: { nightly: 'true' },
            });
            core.info(`Dispatched the ${process.env.BRANCH} nightly.`);
