on:
  # Releases are cut manually, never on push. Run this workflow from the beta
  # branch to cut an rc, or from master for a stable release. A plain push to
  # beta/master (e.g. merging CI changes) must not create a release.
  workflow_dispatch:

name: release

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  auto-release:
    runs-on: ubuntu-slim # lightweight: release-tool + git/gh, no build
    timeout-minutes: 10
    # Only beta (rc) and master (stable) produce releases; refuse a dispatch
    # from any other branch.
    if: github.ref_name == 'beta' || github.ref_name == 'master'

    steps:
      # Mint a short-lived, repo-scoped installation token from the release
      # GitHub App. A non-GITHUB_TOKEN actor is required so the tag push below
      # triggers ci-build; the default GITHUB_TOKEN does not trigger downstream
      # workflows. Using an App (instead of a personal PAT) keeps the token
      # short-lived, least-privilege, and owned by the org rather than a person.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Rebase on top of latest remote
        run: git pull --rebase --autostash origin "${GITHUB_REF_NAME}"

      - name: Fetch all tags
        run: git fetch --tags

      - name: Run release tool
        id: meta
        uses: OpenShock/release-tool@aea812a62e3e06228bbc4ad0a9597b4f22968893 # v0.5.1
        with:
          mode: release
          output: release.json
          notes-output: release-notes.md
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}

      # Precondition: there must be change files accumulated since the last tag.
      # release-tool reports this by leaving the tag output empty; make it a loud
      # failure rather than a silent no-op, since this workflow is run by hand.
      - name: Fail if there is nothing to release
        if: steps.meta.outputs.tag == ''
        run: |
          echo "::error::No change files present since the last tag - nothing to release."
          exit 1

      - name: Push commit and tag
        uses: OpenShock/actions/publish-tag@21ca2d511bca92cf24fb502fa302f82700822584 # v1.1.1
        with:
          tag: ${{ steps.meta.outputs.tag }}

      # The OpenShock API is announced from ci-build's release job, only after
      # the firmware is actually built and uploaded - not here, before it exists.
      # release.json is attached to the draft below so ci-build can read it.

      # Stage the release as a draft. The tag push above triggers ci-build,
      # which builds the firmware and then attaches the binaries to this draft
      # and publishes it (see the `release` job in ci-build.yml). Staging as a
      # draft keeps the release hidden until its artifacts are in place, and
      # avoids ci-build failing on an "already exists" conflict.
      - name: Stage GitHub Release (draft)
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          ARGS=("$TAG" "release.json" --title "$TAG" --notes-file release-notes.md --draft)
          if [ "$PRERELEASE" = "true" ]; then
            ARGS+=(--prerelease)
          fi
          gh release create "${ARGS[@]}"
