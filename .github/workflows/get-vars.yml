# This is a bit of a silly workflow, but Github Workflow definitions
# do not let us easily reuse the strategy matrix used to trigger jobs
# per-board. This is a workaround to define everything in one file, and
# use the output in the multiple places we need it.
#
# Source: https://github.com/orgs/community/discussions/26284#discussioncomment-6701976

on:
  workflow_call:
    outputs:
      version:
        description: 'The current version of the project, e.g.  1.0.0-rc.1+build.1'
        value: ${{ jobs.get-vars.outputs.version }}
      release-channel:
        description: 'The release channel for the current version (stable, beta, dev)'
        value: ${{ jobs.get-vars.outputs.release-channel }}
      board-list:
        description: 'Newline-separated list of boards to build'
        value: ${{ jobs.get-vars.outputs.board-list }}
      board-matrix:
        description: 'JSON matrix of boards to build'
        value: ${{ jobs.get-vars.outputs.board-matrix }}

name: get-vars

jobs:
  get-vars:
    runs-on: ubuntu-slim # pnpm via action-setup, Go via release-tool's setup-go
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get-vars.outputs.version }}
      release-channel: ${{ steps.get-vars.outputs.release-channel }}
      board-list: ${{ steps.get-vars.outputs.board-list }}
      board-matrix: ${{ steps.get-vars.outputs.board-matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github
            .changes

      # Pin Node to the range declared in the scripts package (engines.node),
      # rather than relying on whatever the runner image happens to ship.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .github/scripts/package.json

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        name: Install pnpm
        with:
          cache: true
          cache_dependency_path: .github/scripts/pnpm-lock.yaml
          package_json_file: .github/scripts/package.json
          run_install: |
            - cwd: .github/scripts
              args: [--frozen-lockfile, --strict-peer-dependencies]

      # Single source of truth for the version bump: release-tool computes the
      # next version from .changes/. status mode works on every branch (no
      # branch-config dependency) and creates no tag, so dev/CI builds get
      # labelled as a pre-release of the upcoming version instead of the last tag.
      - name: Compute next version
        id: relmeta
        uses: OpenShock/release-tool@aea812a62e3e06228bbc4ad0a9597b4f22968893 # v0.5.1
        with:
          mode: status

      - name: Get variables
        id: get-vars
        shell: bash
        env:
          RELEASE_NEXT_VERSION: ${{ steps.relmeta.outputs.next-version }}
          RELEASE_SKIP: ${{ steps.relmeta.outputs.skip }}
        run: node .github/scripts/get-vars.js
