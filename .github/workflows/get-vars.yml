# This is a bit of a silly workflow, but Github Workflow definitions do not let us easily reuse the strategy matrix used to trigger jobs per-board.
# This is a workaround to define everything in one file, and use the output in the multiple places we need it.
#
# Source: https://github.com/orgs/community/discussions/26284#discussioncomment-6701976

on:
  workflow_call:
    inputs:
      channel:
        description: 'Channel to publish onto, overriding the one the ref implies. Empty means derive it.'
        required: false
        type: string
        default: ''
    outputs:
      version:
        description: 'The current version of the project, e.g.  1.0.0-rc.1+build.1'
        value: ${{ jobs.get-vars.outputs.version }}
      release-channel:
        description: 'The release channel for the current version (stable, beta, dev)'
        value: ${{ jobs.get-vars.outputs.release-channel }}
      board-list:
        description: 'Newline-separated list of boards to build'
        value: ${{ jobs.get-vars.outputs.board-list }}
      board-matrix:
        description: 'JSON matrix of boards to build'
        value: ${{ jobs.get-vars.outputs.board-matrix }}

name: get-vars

jobs:
  get-vars:
    runs-on: ubuntu-slim # pnpm via action-setup, Go via release-tool's setup-go
    timeout-minutes: 5
    outputs:
      version: ${{ steps.get-vars.outputs.version }}
      release-channel: ${{ steps.get-vars.outputs.release-channel }}
      board-list: ${{ steps.get-vars.outputs.board-list }}
      board-matrix: ${{ steps.get-vars.outputs.board-matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: |
            .github
            .changes
            boards

      # get-vars.py parses tags with the semver package rather than a local regex, so it needs the pinned dependency set.
      # gha.py still self-checks the interpreter floor and fails clearly if the image ever ships something older.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version-file: .github/scripts/.python-version
          cache: 'pip'
          cache-dependency-path: .github/scripts/requirements.txt

      - name: Install script dependencies
        shell: bash
        run: pip install --require-hashes -r .github/scripts/requirements.txt

      # Single source of truth for the version bump: release-tool computes the next version from .changes/. status mode works on every branch (no branch-config dependency) and creates no tag, so dev/CI builds get labelled as a pre-release of the upcoming version instead of the last tag.
      - name: Compute next version
        id: relmeta
        uses: OpenShock/release-tool@ea651e8c10372a10b6f452dcb34c38e60a72dc1f  # v0.5.1
        with:
          mode: status

      - name: Get variables
        id: get-vars
        shell: bash
        env:
          RELEASE_NEXT_VERSION: ${{ steps.relmeta.outputs.next-version }}
          RELEASE_SKIP: ${{ steps.relmeta.outputs.skip }}
          CHANNEL_INPUT: ${{ inputs.channel }}
        run: python .github/scripts/get-vars.py
