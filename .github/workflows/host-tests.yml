# Per-commit firmware check: build and run the host (linux target) Unity suites.
on:
  push:
    branches: ['**']
    paths:
      - 'components/**'
      - 'main/**'
      - 'test/**'
      - 'partitions/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'dependencies.lock'
      - '.gitmodules'
      - '.github/actions/setup-esp-idf/**'
      - '.github/workflows/host-tests.yml'
  # For forks only: a same-repo PR branch is already covered by its push run.
  pull_request:
    paths:
      - 'components/**'
      - 'main/**'
      - 'test/**'
      - 'partitions/**'
      - 'CMakeLists.txt'
      - 'sdkconfig.defaults'
      - 'dependencies.lock'
      - '.gitmodules'
      - '.github/actions/setup-esp-idf/**'
      - '.github/workflows/host-tests.yml'
  workflow_dispatch:

name: host-tests

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The config suite needs the flatbuffers runtime submodule, and only that one.
      - name: Fetch flatbuffers submodule
        run: git submodule update --init --depth 1 components/flatbuffers/flatbuffers

      # The linux target links libbsd; ESP-IDF generates the CMock mocks with Ruby.
      - name: Install host build dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libbsd-dev ruby

      # On develop this also refills the ESP-IDF cache after a key change (it runs on setup-esp-idf edits).
      - uses: ./.github/actions/setup-esp-idf

      # Each components/<name>/host_test is its own linux-target project; the ELF exits with the Unity failure count.
      - name: Build and run host test suites
        shell: bash
        run: |
          set -euo pipefail
          # Drop the toolchains' inner <triple>/bin dirs: their unprefixed `as` would shadow the host's
          # for the linux target ("as: unrecognized option '--64'").
          PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -vE -- '-elf/[^/]*-elf/bin/?$' | paste -sd: -)"
          export PATH
          echo "as: $(command -v as)"
          failed=()
          for dir in components/*/host_test; do
            name="$(basename "$(dirname "$dir")")"
            echo "::group::$name"
            if idf.py -C "$dir" --preview set-target linux build \
              && "$dir"/build/*_host_test.elf; then
              echo "::endgroup::"
            else
              echo "::endgroup::"
              echo "::error::$name host tests failed"
              failed+=("$name")
            fi
          done
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Failed: ${failed[*]}"
            exit 1
          fi
