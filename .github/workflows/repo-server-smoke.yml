on:
  workflow_dispatch:
    inputs:
      server_url:
        description: 'Base URL of the repository server to check'
        required: false
        default: 'https://repo.openshock.dev'
      audience:
        description: 'OIDC audience, must match OPENSHOCK__CICD__AUDIENCE on the server'
        required: false
        default: 'openshock-repository-server'
  # Also runs when the repository-server plumbing itself changes, on any branch.
  # workflow_dispatch only offers a workflow that already exists on the default branch,
  # so without this the check could not be run from the branch developing it.
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/repo-server-smoke.yml'
      - '.github/actions/repo-server-*/**'

name: repo-server-smoke

# Standalone check that this repository can publish firmware, without publishing
# anything. It is the same preflight ci-build runs before a deploy, callable on its own
# so the server can be checked after an admin change (a board added, a scope granted)
# without waiting for a build.
#
# It deliberately does not upload: preflight is reads only. What exercises the actual
# publish path is the dry run in ci-build, which stages a real release from real
# artifacts and then discards it.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  smoke:
    name: Repository server preflight
    runs-on: ubuntu-slim # lightweight: curl + jq, checkout only for the board list
    timeout-minutes: 5
    permissions:
      contents: read
      id-token: write

    steps:

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          sparse-checkout: |
            .github
            boards

      # Every board this repository builds, which is what a full release would declare.
      # ci-build takes the same list from get-vars; here it is read straight off disk so
      # the check stands alone.
      - name: Collect board list
        id: boards
        shell: bash
        run: |
          set -euo pipefail
          {
            echo 'list<<EOF'
            for f in boards/*.defaults; do basename "$f" .defaults; done
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/repo-server-token
        id: token
        with:
          audience: ${{ inputs.audience || 'openshock-repository-server' }}

      - uses: ./.github/actions/repo-server-preflight
        with:
          server-url: ${{ inputs.server_url || 'https://repo.openshock.dev' }}
          token: ${{ steps.token.outputs.token }}
          boards: ${{ steps.boards.outputs.list }}

      - name: Summary
        if: always()
        shell: bash
        env:
          SERVER_URL: ${{ inputs.server_url || 'https://repo.openshock.dev' }}
          RESULT: ${{ job.status }}
        run: |
          {
            echo "## Repository server preflight"
            echo
            echo "Server \`$SERVER_URL\`: **$RESULT**"
            echo
            echo "Checks: server reachable, ${GITHUB_REPOSITORY} authorised to publish firmware,"
            echo "every built board present in the catalog. See the step logs for which one failed."
          } >> "$GITHUB_STEP_SUMMARY"
