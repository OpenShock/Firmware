[project]
name = 'openshock-firmware-tools'
version = '0.0.0'
requires-python = '>=3.10'

[tool.pytest.ini_options]
pythonpath = ['scripts', 'scripts/tests', 'certificates', 'tools/sdlog']
testpaths = ['scripts/tests']

[tool.ruff]
target-version = 'py310'
line-length = 120
extend-exclude = ['components', 'managed_components', 'frontend', 'build', 'tmp']

[tool.ruff.format]
quote-style = 'single'

[tool.ruff.lint]
select = ['E', 'F', 'I', 'UP', 'B', 'SIM']
ignore = ['E501', 'SIM108']

[tool.ruff.lint.isort]
known-first-party = ['utils']

[tool.mypy]
python_version = '3.10'
files = ['scripts']
# Unannotated functions are checked too, so a missing annotation cannot hide a body from the check.
check_untyped_defs = true
exclude = ['/tests/']

[[tool.mypy.overrides]]
module = ['esptool', 'esptool.*', 'littlefs', 'requests']
ignore_missing_imports = true
